steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/web:latest'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/web:latest'

options:
  machineType: 'E2_HIGHCPU_8'
