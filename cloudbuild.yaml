steps:
  # 1. Customer Service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/services/customer-service/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/customer-service:latest'
      - '.'

  # 2. Account Service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/services/account-service/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/account-service:latest'
      - '.'

  # 3. Transaction Service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/services/transaction-service/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/transaction-service:latest'
      - '.'

  # 4. Payment Service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/services/payment-service/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/payment-service:latest'
      - '.'

  # 5. Notification & Audit Service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/services/notification-audit-service/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/notification-audit-service:latest'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/customer-service:latest'
  - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/account-service:latest'
  - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/transaction-service:latest'
  - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/payment-service:latest'
  - 'us-central1-docker.pkg.dev/project-0d3c28c7-a4e0-44ad-a4e/bank-images/notification-audit-service:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'
