{{/*
  partner-bank-mock (T-57): el banco pareja simulado, DENTRO del clúster.

  Sólo existe con `partnerMock.enabled=true`, y el valor por defecto es `false`.
  Un banco que despliega a su propia contraparte es un banco que puede aprobar
  una prueba que en realidad no pasó, así que encenderlo tiene que ser un acto
  deliberado y visible en los valores del release.

  Para qué hace falta en el clúster y no sólo en Compose:

  - El escenario de fallo OBLIGATORIO de T-51 («el banco pareja no responde,
    responde lento o rechaza») se inyecta con el mock propio, nunca apagando el
    sistema del otro grupo. Si el mock sólo corre en una laptop, ese escenario
    no se puede ejecutar donde están los dashboards y el HPA.
  - §4.1 admite evaluar contra el mock como último recurso si el banco pareja
    no está disponible el día de la calificación. Ese último recurso tiene que
    estar desplegable.

  No lleva `checksum/config`: su configuración vive en el env de este
  Deployment, así que cambiar `callbackMode` ya cambia el spec y el pod rueda
  solo. Y no lleva HPA: es una herramienta de prueba, no una carga a escalar.
*/}}
{{- if .Values.partnerMock.enabled }}
{{- $component := .Values.partnerMock.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.partnerMock }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
    # Que un `kubectl get` diga a simple vista que esto NO es el banco.
    bank-usac.io/role: test-double
spec:
  replicas: {{ $cfg.replicaCount }}
  {{- include "bank-usac.updateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # El checksum del Secret, no del ConfigMap: lo unico del mock que vive
        # fuera de este Deployment es el token compartido, y **un pod no vuelve a
        # leer un Secret**. Sin esto, dar de alta el token dejaba al mock
        # corriendo con el valor vacio que leyo al arrancar, y la respuesta era
        # `401 unauthorized` sin que nada explicara por que. Visto al levantar
        # el camino local por primera vez.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
        bank-usac.io/role: test-double
    spec:
      {{- include "bank-usac.gracefulShutdown" . | nindent 6 }}
      containers:
        - name: app
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy | default .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
          env:
            - name: PARTNER_MOCK_PORT
              value: {{ $cfg.port | quote }}
            # A qué Gateway manda los depósitos. Por defecto, el de este mismo
            # release: el mock simula el banco de ENFRENTE, así que su destino
            # es nuestra propia entrada.
            - name: PARTNER_GATEWAY_URL
              value: {{ $cfg.gatewayUrl | default (printf "http://%s:%v" (include "bank-usac.componentFullname" (dict "root" $ "component" $.Values.gateway.component)) $.Values.gateway.port) | quote }}
            # El mismo secreto compartido que exige la entrada del Gateway: si
            # no coinciden, el mock recibe 401 y eso es lo correcto.
            - name: INTERBANK_PARTNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: INTERBANK_PARTNER_TOKEN
            {{- range $key := list "INTERBANK_BANK_CODE" "INTERBANK_PARTNER_BANK_CODE" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" $ }}-config
                  key: {{ $key }}
            {{- end }}
            # La inyección de fallos de T-51.
            - name: PARTNER_CALLBACK_MODE
              value: {{ $cfg.callbackMode | quote }}
            - name: PARTNER_CALLBACK_DELAY_MS
              value: {{ $cfg.callbackDelayMs | quote }}
            - name: PARTNER_CALLBACK_FAIL_COUNT
              value: {{ $cfg.callbackFailCount | quote }}
          # Una sonda y no dos, a diferencia de los siete componentes del banco.
          # `/ready` existe en ellos porque tienen de qué no estar listos: una
          # base de datos y un broker. El mock no tiene dependencias — si el
          # proceso está arriba, está listo — así que un `/ready` separado
          # respondería exactamente lo mismo que `/health` y mentiría sobre
          # tener dos preguntas distintas.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
{{- end }}
