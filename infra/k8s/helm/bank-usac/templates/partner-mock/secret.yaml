{{/*
  El token de administración del mock (T-60 / B8), en su PROPIO Secret.

  No va en el Secret del chart (`secret.yaml`) porque lo comparten los siete
  componentes del banco y el mock es un doble de prueba que puede no existir:
  una clave que sólo importa cuando `partnerMock.enabled=true` no debe viajar
  en el objeto que lee el Gateway. Vacío = la API `/admin/*` del mock queda
  deshabilitada (responde 403), que es el valor por defecto.
*/}}
{{- if .Values.partnerMock.enabled }}
{{- $ctx := dict "root" $ "component" .Values.partnerMock.component }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
    bank-usac.io/role: test-double
type: Opaque
stringData:
  PARTNER_MOCK_ADMIN_TOKEN: {{ .Values.partnerMock.adminToken | default "" | quote }}
{{- end }}
