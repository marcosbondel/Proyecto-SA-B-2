{{- if ne .Values.web.enabled false }}
{{- $component := .Values.web.component }}
{{- $ctx := dict "root" $ "component" $component }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.web.serviceType | default "ClusterIP" }}
  selector:
    {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
{{- end }}
