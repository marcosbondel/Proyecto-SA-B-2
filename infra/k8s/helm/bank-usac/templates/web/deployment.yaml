# web — the Nuxt frontend. Env matches docs/operations/CONTAINERS.md's web
# row: no required variables, NUXT_PUBLIC_API_BASE_URL optional.
# NITRO_HOST/NITRO_PORT are baked into the image at build time (they select
# which interface the Nitro preset binds, not a deployment), so they are
# deliberately not set here.
{{- if ne .Values.web.enabled false }}
{{- $component := .Values.web.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.web }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            - name: NUXT_PUBLIC_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NUXT_PUBLIC_API_BASE_URL
          # web's /ready deliberately does not probe the gateway (it checks
          # only that NUXT_PUBLIC_API_BASE_URL is a well-formed origin) —
          # see docs/operations/CONTAINERS.md, "The frontend's readiness
          # does not probe the Gateway."
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
{{- end }}
