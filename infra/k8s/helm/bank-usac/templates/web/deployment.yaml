# web — the Nuxt frontend. Env matches docs/operations/CONTAINERS.md's web
# row: no required variables, NUXT_PUBLIC_API_BASE_URL and
# NUXT_PUBLIC_GRAFANA_URL optional.
# NITRO_HOST/NITRO_PORT are baked into the image at build time (they select
# which interface the Nitro preset binds, not a deployment), so they are
# deliberately not set here.
{{- if ne .Values.web.enabled false }}
{{- $component := .Values.web.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.web }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  {{- include "bank-usac.updateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # **Un pod no vuelve a leer un ConfigMap ni un Secret**: los lee una vez
        # al arrancar. Sin estos dos hashes, dar de alta o rotar una credencial
        # deja el proceso corriendo con el valor anterior y el despliegue sale
        # verde (TD-089).
        #
        # El sintoma no es un error, es un rechazo CORRECTO de un valor
        # equivocado, que es mucho mas dificil de diagnosticar. Visto el
        # 2026-10-14: con el token interbancario recien anadido al Secret, el
        # Gateway respondia `401 UNAUTHENTICATED` con un `correlationId` y
        # ninguna pista, porque seguia usando el token vacio que leyo al
        # arrancar.
        #
        # Si, un cambio de Secret rueda los siete. Es la decision tomada en
        # TD-089 y es la correcta: una rotacion que no rueda los pods es una
        # rotacion que no ocurrio, y el modo de fallo es silencioso. Rodar siete
        # pods es un despliegue normal con sus sondas; perder una rotacion es un
        # servicio usando una credencial revocada sin que nada lo diga.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "bank-usac.gracefulShutdown" . | nindent 6 }}
      containers:
        - name: app
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Deja de recibir trafico antes de empezar a cerrarse: ver
          # `bank-usac.gracefulShutdown` en _helpers.tpl.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            - name: NUXT_PUBLIC_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NUXT_PUBLIC_API_BASE_URL
            # Optional (T-60): where a trace id on screen links to. Empty = text.
            - name: NUXT_PUBLIC_GRAFANA_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NUXT_PUBLIC_GRAFANA_URL
          # web's /ready deliberately does not probe the gateway (it checks
          # only that NUXT_PUBLIC_API_BASE_URL is a well-formed origin) —
          # see docs/operations/CONTAINERS.md, "The frontend's readiness
          # does not probe the Gateway."
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
{{- end }}
