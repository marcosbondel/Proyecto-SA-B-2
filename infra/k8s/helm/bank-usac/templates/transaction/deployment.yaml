# Transaction Service (T-18). Env matches docs/operations/CONTAINERS.md's
# transaction-service row: NODE_ENV, PORT, DATABASE_URL, RABBITMQ_URL — no
# optional variables. It decides no funds and calls no other service
# (test/isolation.spec.ts enforces this in the image, not here).
{{- $component := .Values.services.transaction.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.services.transaction }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  {{- include "bank-usac.updateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # **Un pod no vuelve a leer un ConfigMap ni un Secret**: los lee una vez
        # al arrancar. Sin estos dos hashes, dar de alta o rotar una credencial
        # deja el proceso corriendo con el valor anterior y el despliegue sale
        # verde (TD-089).
        #
        # El sintoma no es un error, es un rechazo CORRECTO de un valor
        # equivocado, que es mucho mas dificil de diagnosticar. Visto el
        # 2026-10-14: con el token interbancario recien anadido al Secret, el
        # Gateway respondia `401 UNAUTHENTICATED` con un `correlationId` y
        # ninguna pista, porque seguia usando el token vacio que leyo al
        # arrancar.
        #
        # Si, un cambio de Secret rueda los siete. Es la decision tomada en
        # TD-089 y es la correcta: una rotacion que no rueda los pods es una
        # rotacion que no ocurrio, y el modo de fallo es silencioso. Rodar siete
        # pods es un despliegue normal con sus sondas; perder una rotacion es un
        # servicio usando una credencial revocada sin que nada lo diga.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "bank-usac.gracefulShutdown" . | nindent 6 }}
      containers:
        - name: app
          image: "{{ .Values.services.transaction.image.repository }}:{{ .Values.services.transaction.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Deja de recibir trafico antes de empezar a cerrarse: ver
          # `bank-usac.gracefulShutdown` en _helpers.tpl.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: {{ .Values.services.transaction.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            {{- include "bank-usac.telemetryEnv" (dict "root" $ "tag" .Values.services.transaction.image.tag) | nindent 12 }}
            - name: PORT
              value: {{ .Values.services.transaction.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: TRANSACTION_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RABBITMQ_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
