# Notification & Audit Service (T-20). Env matches
# docs/operations/CONTAINERS.md's notification-audit-service row: NODE_ENV,
# PORT, DATABASE_URL, RABBITMQ_URL required; REVEAL_ACTIVATION_LINKS,
# NOTIFICATION_CHANNEL and the four Resend variables optional.
#
# The Resend variables are wired unconditionally, which is safe because the
# service reads RESEND_API_KEY, EMAIL_FROM and APP_BASE_URL only in the
# "resend" branch — under the default "simulated" channel they arrive empty and
# unused. Wiring them conditionally instead would mean the `helm upgrade` that
# switches the channel also has to add three variables, and a pod that boots
# without them crash-loops on environment validation instead of saying what is
# missing.
#
# What IS conditional is the guard below: with the channel on "resend" and any
# of the three empty, the chart refuses to render and names the value, the same
# contract templates/secret.yaml gives the database passwords
# (docs/operations/EMAIL_RESEND.md).
{{- $component := .Values.services.notificationAudit.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.services.notificationAudit }}
{{- if eq $cfg.notificationChannel "resend" }}
  {{- if not .Values.secrets.resendApiKey }}
    {{- fail "notificationChannel is \"resend\" but secrets.resendApiKey is empty — pass it at install time, e.g. --set secrets.resendApiKey=re_xxxxxxxx (docs/operations/EMAIL_RESEND.md)" }}
  {{- end }}
  {{- if not $cfg.resend.emailFrom }}
    {{- fail "notificationChannel is \"resend\" but services.notificationAudit.resend.emailFrom is empty — it must name a sender on a domain verified in Resend (docs/operations/EMAIL_RESEND.md)" }}
  {{- end }}
  {{- if not $cfg.resend.appBaseUrl }}
    {{- fail "notificationChannel is \"resend\" but services.notificationAudit.resend.appBaseUrl is empty — without it the activation link in the email has no origin (docs/operations/EMAIL_RESEND.md)" }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  {{- include "bank-usac.updateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # This component alone carries these, and the asymmetry is deliberate.
        # Its whole configuration — the delivery channel, the sender, the API
        # key — lives in the ConfigMap and the Secret, and none of it appears in
        # the pod spec: every variable arrives by configMapKeyRef or
        # secretKeyRef, whose *key names* never change. Without a checksum, a
        # `helm upgrade` that flips the channel to "resend" would leave the
        # running pod on the old env and send nothing, which is precisely the
        # symptom this wiring exists to remove.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "bank-usac.gracefulShutdown" . | nindent 6 }}
      containers:
        - name: app
          image: "{{ .Values.services.notificationAudit.image.repository }}:{{ .Values.services.notificationAudit.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Deja de recibir trafico antes de empezar a cerrarse: ver
          # `bank-usac.gracefulShutdown` en _helpers.tpl.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: {{ .Values.services.notificationAudit.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            {{- include "bank-usac.telemetryEnv" (dict "root" $ "tag" .Values.services.notificationAudit.image.tag) | nindent 12 }}
            - name: PORT
              value: {{ .Values.services.notificationAudit.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: NOTIFICATION_AUDIT_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: REVEAL_ACTIVATION_LINKS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: REVEAL_ACTIVATION_LINKS
            - name: NOTIFICATION_CHANNEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NOTIFICATION_CHANNEL
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RESEND_API_KEY
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: EMAIL_FROM
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: APP_BASE_URL
            - name: RESEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: RESEND_API_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
