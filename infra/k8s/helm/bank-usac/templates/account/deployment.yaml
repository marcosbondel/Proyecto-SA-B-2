# Account Service (T-17). Env matches docs/operations/CONTAINERS.md's
# account-service row: NODE_ENV, PORT, DATABASE_URL, RABBITMQ_URL required;
# DEACTIVATION_* optional and included here so a demo does not wait six
# months for the automatic-deactivation job to do something.
{{- $component := .Values.services.account.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.services.account }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  {{- include "bank-usac.updateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # The ConfigMap is read as environment variables, which a running pod
        # never re-reads. Hashing it here is what makes a changed N or M (T-42)
        # roll the pods on `helm upgrade` instead of waiting for a restart
        # somebody has to remember.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "bank-usac.gracefulShutdown" . | nindent 6 }}
      containers:
        - name: app
          image: "{{ .Values.services.account.image.repository }}:{{ .Values.services.account.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Deja de recibir trafico antes de empezar a cerrarse: ver
          # `bank-usac.gracefulShutdown` en _helpers.tpl.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: {{ .Values.services.account.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            {{- include "bank-usac.telemetryEnv" (dict "root" $ "tag" .Values.services.account.image.tag) | nindent 12 }}
            - name: PORT
              value: {{ .Values.services.account.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: ACCOUNT_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: DEACTIVATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: DEACTIVATION_ENABLED
            - name: DEACTIVATION_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: DEACTIVATION_INTERVAL_MS
            - name: INACTIVITY_MONTHS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: INACTIVITY_MONTHS
            - name: INACTIVITY_MIN_BALANCE_MINOR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: INACTIVITY_MIN_BALANCE_MINOR
            - name: ANOMALY_MAX_OPERATIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: ANOMALY_MAX_OPERATIONS
            - name: ANOMALY_WINDOW_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: ANOMALY_WINDOW_MINUTES
            - name: SEED_DEMO_DATA
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: SEED_DEMO_DATA
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
