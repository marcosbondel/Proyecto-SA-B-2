# TEMPLATE — every value below is built from `.Values.secrets.*`, which
# defaults to "" in values.yaml and is never committed with a real value
# (ADR-007: "Secrets reach the cluster through chart values or --set-file,
# never committed"). `required` makes a bare `helm install` fail at
# template-render time, naming the exact missing value, rather than
# deploying a pod that will only find out its password is empty when
# PostgreSQL rejects the connection.
#
# Populate at install time, e.g.:
#   helm upgrade --install bank-usac infra/k8s/helm/bank-usac \
#     --namespace bank-usac --create-namespace \
#     -f infra/k8s/kind/generated-external.values.yaml \
#     --set secrets.jwtSecret="$(openssl rand -hex 32)" \
#     --set secrets.rabbitmq.password=changeme \
#     --set secrets.objectStorage.accessKey=... \
#     --set secrets.objectStorage.secretKey=... \
#     --set secrets.databases.customer.password=... \
#     --set secrets.databases.account.password=... \
#     --set secrets.databases.transaction.password=... \
#     --set secrets.databases.payment.password=... \
#     --set secrets.databases.notificationAudit.password=...
# or point every one of those at an untracked values file with -f instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bank-usac.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required — the gateway will not start without it" .Values.secrets.jwtSecret | quote }}

  # Deliberately outside `required`, unlike every other value in this file: the
  # default "simulated" channel sends no mail and needs no key, so demanding one
  # would break every install that does not want outbound email. The
  # notification-audit template is what refuses to render when the channel is
  # "resend" and this is still empty.
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}

  # The shared secret Grafana presents at POST /api/alerts/slo (T-45). Outside
  # `required` for the same reason as the key above, and the Gateway fails
  # *closed* without it: an empty value reaches the container as "no token", and
  # the webhook then refuses every caller instead of admitting anybody.
  ALERT_WEBHOOK_TOKEN: {{ .Values.secrets.alertWebhookToken | quote }}

  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmq.password | quote }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq:%s"
    .Values.secrets.rabbitmq.user
    (required "secrets.rabbitmq.password is required" .Values.secrets.rabbitmq.password)
    (include "bank-usac.externalPort" (dict "root" $ "key" "rabbitmq"))
    | quote }}

  OBJECT_STORAGE_ENDPOINT: {{ printf "http://minio:%s" (include "bank-usac.externalPort" (dict "root" $ "key" "minio")) | quote }}
  OBJECT_STORAGE_ACCESS_KEY: {{ required "secrets.objectStorage.accessKey is required" .Values.secrets.objectStorage.accessKey | quote }}
  OBJECT_STORAGE_SECRET_KEY: {{ required "secrets.objectStorage.secretKey is required" .Values.secrets.objectStorage.secretKey | quote }}
  OBJECT_STORAGE_BUCKET: {{ .Values.secrets.objectStorage.bucket | quote }}
  OBJECT_STORAGE_REGION: {{ .Values.secrets.objectStorage.region | quote }}

  CUSTOMER_DATABASE_URL: {{ printf "postgresql://%s:%s@postgres-customer:%s/%s"
    .Values.databases.customer.user
    (required "secrets.databases.customer.password is required" .Values.secrets.databases.customer.password)
    (include "bank-usac.externalPort" (dict "root" $ "key" "postgresCustomer"))
    (printf "%s%s" .Values.databases.customer.name (default "" .Values.databaseSuffix))
    | quote }}

  ACCOUNT_DATABASE_URL: {{ printf "postgresql://%s:%s@postgres-account:%s/%s"
    .Values.databases.account.user
    (required "secrets.databases.account.password is required" .Values.secrets.databases.account.password)
    (include "bank-usac.externalPort" (dict "root" $ "key" "postgresAccount"))
    (printf "%s%s" .Values.databases.account.name (default "" .Values.databaseSuffix))
    | quote }}

  TRANSACTION_DATABASE_URL: {{ printf "postgresql://%s:%s@postgres-transaction:%s/%s"
    .Values.databases.transaction.user
    (required "secrets.databases.transaction.password is required" .Values.secrets.databases.transaction.password)
    (include "bank-usac.externalPort" (dict "root" $ "key" "postgresTransaction"))
    (printf "%s%s" .Values.databases.transaction.name (default "" .Values.databaseSuffix))
    | quote }}

  PAYMENT_DATABASE_URL: {{ printf "postgresql://%s:%s@postgres-payment:%s/%s"
    .Values.databases.payment.user
    (required "secrets.databases.payment.password is required" .Values.secrets.databases.payment.password)
    (include "bank-usac.externalPort" (dict "root" $ "key" "postgresPayment"))
    (printf "%s%s" .Values.databases.payment.name (default "" .Values.databaseSuffix))
    | quote }}

  NOTIFICATION_AUDIT_DATABASE_URL: {{ printf "postgresql://%s:%s@postgres-notification-audit:%s/%s"
    .Values.databases.notificationAudit.user
    (required "secrets.databases.notificationAudit.password is required" .Values.secrets.databases.notificationAudit.password)
    (include "bank-usac.externalPort" (dict "root" $ "key" "postgresNotificationAudit"))
    (printf "%s%s" .Values.databases.notificationAudit.name (default "" .Values.databaseSuffix))
    | quote }}
