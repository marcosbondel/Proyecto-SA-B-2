# Payment Service (T-21). Env matches docs/operations/CONTAINERS.md's
# payment-service row: NODE_ENV, PORT, DATABASE_URL, RABBITMQ_URL required;
# PAYMENT_RETRY_DELAYS_MS / PAYMENT_RETRY_SWEEP_MS optional, and set here so
# the retry ladder is explicit rather than left to the code's own default.
# PAYMENT_SIM_* (T-44) are the provider simulation's defaults; an override made
# at run time lives in the database and wins over them until a reset.
{{- $component := .Values.services.payment.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.services.payment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  {{- include "bank-usac.updateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # The ConfigMap is read as environment variables, which a running pod
        # never re-reads. Hashing it here is what makes a changed default
        # simulation (T-44) roll the pods on `helm upgrade` instead of waiting
        # for a restart somebody has to remember.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "bank-usac.gracefulShutdown" . | nindent 6 }}
      containers:
        - name: app
          image: "{{ .Values.services.payment.image.repository }}:{{ .Values.services.payment.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Deja de recibir trafico antes de empezar a cerrarse: ver
          # `bank-usac.gracefulShutdown` en _helpers.tpl.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: {{ .Values.services.payment.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            {{- include "bank-usac.telemetryEnv" (dict "root" $ "tag" .Values.services.payment.image.tag) | nindent 12 }}
            - name: PORT
              value: {{ .Values.services.payment.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: PAYMENT_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: PAYMENT_RETRY_DELAYS_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: PAYMENT_RETRY_DELAYS_MS
            - name: PAYMENT_RETRY_SWEEP_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: PAYMENT_RETRY_SWEEP_MS
            - name: PAYMENT_SIM_FAILURE_RATE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: PAYMENT_SIM_FAILURE_RATE
            - name: PAYMENT_SIM_TIMEOUT_RATE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: PAYMENT_SIM_TIMEOUT_RATE
            - name: PAYMENT_SIM_LATENCY_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: PAYMENT_SIM_LATENCY_MS
            # La API key que mandamos como X-Api-Key al banco pareja. `optional`:
            # sin ella el envio no arranca, pero el pod si.
            - name: INTERBANK_API_KEY_OUTBOUND
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: INTERBANK_API_KEY_OUTBOUND
                  optional: true
            - name: INTERBANK_PARTNERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: INTERBANK_PARTNERS
                  optional: true
            {{- range $key := list "INTERBANK_BANK_CODE" "INTERBANK_PARTNER_BANK_CODE" "INTERBANK_PARTNER_BASE_URL" "INTERBANK_MAX_AMOUNT_MINOR" "INTERBANK_CONFIRMATION_TIMEOUT_MS" "INTERBANK_RESOLVE_RETRY_MS" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" $ }}-config
                  key: {{ $key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
