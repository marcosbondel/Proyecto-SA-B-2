{{- $component := .Values.services.customer.component }}
{{- $ctx := dict "root" $ "component" $component }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.services.customer.port }}
      targetPort: http
