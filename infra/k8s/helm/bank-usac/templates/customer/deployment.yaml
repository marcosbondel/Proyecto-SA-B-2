# Customer Service (T-16). Env matches docs/operations/CONTAINERS.md's
# customer-service row exactly: NODE_ENV, PORT, DATABASE_URL, RABBITMQ_URL,
# OBJECT_STORAGE_* — all required, none optional.
{{- $component := .Values.services.customer.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.services.customer }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.services.customer.image.repository }}:{{ .Values.services.customer.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.customer.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            - name: PORT
              value: {{ .Values.services.customer.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: CUSTOMER_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: OBJECT_STORAGE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_ENDPOINT
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_ACCESS_KEY
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_SECRET_KEY
            - name: OBJECT_STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_BUCKET
            - name: OBJECT_STORAGE_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_REGION
            - name: SEED_DEMO_DATA
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: SEED_DEMO_DATA
            - name: SEED_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: SEED_PASSWORD
          # The port opens before migrations/broker attach (T-21), so
          # liveness can probe almost immediately; readiness is what waits
          # for the database, the broker and its queues.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
