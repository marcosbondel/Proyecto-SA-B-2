# Gateway. Env matches docs/operations/CONTAINERS.md's gateway row:
# NODE_ENV, PORT, RABBITMQ_URL, JWT_SECRET, JWT_EXPIRES_IN, OBJECT_STORAGE_*
# required; GATEWAY_INSTANCE_ID, REPLY_TIMEOUT_MS, CORS_ALLOWED_ORIGINS
# optional and included here. Deliberately no DATABASE_URL — the Gateway
# holds no business data (constitution II and V) and has no way to acquire
# one.
{{- $component := .Values.gateway.component }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $cfg := .Values.gateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-usac.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-usac.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount | default .Values.replicaCount }}
  {{- include "bank-usac.updateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bank-usac.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "bank-usac.gracefulShutdown" . | nindent 6 }}
      containers:
        - name: app
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Deja de recibir trafico antes de empezar a cerrarse: ver
          # `bank-usac.gracefulShutdown` en _helpers.tpl.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: NODE_ENV
            {{- include "bank-usac.telemetryEnv" (dict "root" $ "tag" .Values.gateway.image.tag) | nindent 12 }}
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: JWT_EXPIRES_IN
            # The SLO webhook's shared secret (T-45). `optional` so a release
            # without one still starts — and then the webhook refuses everybody.
            - name: ALERT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: ALERT_WEBHOOK_TOKEN
                  optional: true
            # Los dos códigos de banco que el contrato oficial exige (T-56). Del
            # ConfigMap: son configuración y no secretos — están publicados en
            # el acuerdo de integración.
            {{- range $key := list "INTERBANK_BANK_CODE" "INTERBANK_PARTNER_BANK_CODE" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" $ }}-config
                  key: {{ $key }}
            {{- end }}
            - name: INTERBANK_API_KEY_INBOUND
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: INTERBANK_API_KEY_INBOUND
                  optional: true
            - name: INTERBANK_PARTNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: INTERBANK_PARTNER_TOKEN
            # Names this replica's private reply queue, which the broker
            # declares `exclusive` (apps/packages/messaging/src/broker.ts) so
            # that two replicas cannot share one — a shared queue would have
            # replies delivered round-robin, and the answer to one instance's
            # question would land on an instance with nobody waiting for it.
            #
            # It therefore has to differ per pod. A ConfigMap value cannot:
            # every replica would read the same string, the second one's
            # `assertQueue` would fail RESOURCE_LOCKED, and the Gateway could
            # never scale past one. The downward API gives each pod its own
            # name, which is unique per replica and per restart.
            - name: GATEWAY_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPLY_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: REPLY_TIMEOUT_MS
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-config
                  key: CORS_ALLOWED_ORIGINS
            - name: OBJECT_STORAGE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_ENDPOINT
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_ACCESS_KEY
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_SECRET_KEY
            - name: OBJECT_STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_BUCKET
            - name: OBJECT_STORAGE_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: OBJECT_STORAGE_REGION
          # The Gateway bounds its own wait for the broker at ten seconds and
          # comes up degraded rather than blocking app.listen() — so, like
          # the five services, liveness can probe almost immediately.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml ($cfg.resources | default .Values.resources) | nindent 12 }}
