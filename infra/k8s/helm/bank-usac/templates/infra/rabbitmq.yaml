{{- if and .Values.rabbitmq .Values.rabbitmq.inCluster }}
{{- $persistence := .Values.rabbitmq.persistence | default dict }}
{{- /* `default true false` es true: un `enabled: false` explicito se perderia. */}}
{{- $persist := true }}
{{- if hasKey $persistence "enabled" }}
{{- $persist = $persistence.enabled }}
{{- end }}
# El consumer lag del broker es un SLI obligatorio de la Fase 3 (§4.1,
# "Métricas (SLI base)"). RabbitMQ lo publica él mismo —
# `rabbitmq_queue_messages_ready` por cola — con el plugin `rabbitmq_prometheus`,
# que viene en la distribución pero NO habilitado. Se habilita con este fichero
# en vez de con un exportador aparte: un pod menos, una versión menos que
# seguir, y las métricas vienen del broker y no de alguien que le pregunta.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "bank-usac.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rabbitmq
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
{{- if $persist }}
---
# El disco del broker (TD-082, D5). Sin esto las colas viven en la capa
# escribible del contenedor: cualquier reemplazo del pod —un rollout, un drain,
# un OOM— las borra, y una Saga que esperaba un mensaje en cola se queda en
# PENDING para siempre (visto en produccion el 2026-10-19 al escalar el broker
# a cero). Las colas y los mensajes del banco ya son durables y persistentes;
# lo que faltaba era un lugar donde sobrevivir.
#
# Lo que debe saber quien opere esto:
#  - `helm uninstall` BORRA este claim y con el los mensajes pendientes. No lleva
#    `helm.sh/resource-policy: keep` a proposito: `helm-deploy.sh` desinstala un
#    primer despliegue fallido y reinstala, y un claim huerfano haria fallar esa
#    reinstalacion por propiedad de Helm.
#  - Rotar `secrets.rabbitmq.password` YA NO basta. `RABBITMQ_DEFAULT_USER/PASS`
#    solo se aplican cuando el directorio de datos esta vacio; con el volumen, el
#    usuario `bank_app` ya existe y conserva la clave vieja. Tras rotarla hay que
#    cambiarla tambien en el broker:
#    `kubectl exec deploy/rabbitmq -- rabbitmqctl change_password bank_app <nueva>`.
#  - Sin `storageClassName` se usa la clase por defecto del cluster (`standard-rwo`
#    en GKE, `standard` en kind). El tamano de un claim existente no se reduce.
#  - Es ReadWriteOnce: un solo nodo a la vez. Por eso el Deployment de abajo no
#    levanta el pod nuevo hasta que el viejo se ha ido (`maxSurge: 0`).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "bank-usac.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rabbitmq
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | default "2Gi" | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "bank-usac.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rabbitmq
spec:
  replicas: 1
  {{- if $persist }}
  # Un solo pod a la vez, y el viejo se va ANTES de que llegue el nuevo: el
  # volumen es ReadWriteOnce (dos pods no lo montan a la vez) y nunca deben
  # escribir dos brokers el mismo directorio. `maxSurge: 0` + `maxUnavailable: 1`
  # es `Recreate` en la practica, con un costo de unos segundos sin broker en
  # cada rollout que los servicios ya toleran (reconectan o se reinician).
  #
  # Se escribe asi y NO como `strategy.type: Recreate` a proposito. Cambiar el
  # tipo en un `helm upgrade` sobre un release que ya existia falla: el
  # Deployment vivo trae `rollingUpdate` relleno por defecto, y la API rechaza
  # `Recreate` con ese bloque presente. `rollingUpdate: null` lo resuelve con
  # Helm 3 pero NO con Helm 4 (server-side apply no borra un campo que puso el
  # servidor): se comprobo con `helm upgrade` real sobre un release viejo. Esta
  # forma solo cambia valores, asi que funciona igual en los dos.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bank-usac.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bank-usac.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rabbitmq
      annotations:
        checksum/plugins: {{ printf "[rabbitmq_management,rabbitmq_prometheus]." | sha256sum }}
    spec:
      {{- if $persist }}
      # El volumen llega a nombre de root; la imagen corre RabbitMQ como el
      # usuario `rabbitmq` (uid 999). `fsGroup` le da escritura sin cambiar el
      # usuario del contenedor.
      securityContext:
        fsGroup: 999
      {{- end }}
      volumes:
        - name: plugins
          configMap:
            name: rabbitmq-plugins
        {{- if $persist }}
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        {{- end }}
      containers:
        - name: rabbitmq
          image: "rabbitmq:3.13-management"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
          volumeMounts:
            # RabbitMQ lee la lista de plugins de este fichero al arrancar. Se
            # monta por `subPath` porque el directorio lleva además la
            # configuración que la imagen genera, y un montaje de directorio la
            # taparía.
            - name: plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            {{- if $persist }}
            # Se monta el directorio padre y no `mnesia/`: un volumen recien
            # formateado trae `lost+found/` en su raiz, y RabbitMQ lo leeria como
            # un nodo.
            - name: data
              mountPath: /var/lib/rabbitmq
            {{- end }}
          env:
            {{- if $persist }}
            # EL DETALLE QUE HACE QUE EL DISCO SIRVA. RabbitMQ guarda su estado
            # en `mnesia/rabbit@<hostname>`, y el hostname de un pod de
            # Deployment cambia en cada reemplazo (`rabbitmq-<hash>-<id>`): sin
            # fijar el nombre del nodo, el pod nuevo abre un directorio vacio al
            # lado del viejo y las colas "desaparecen" aunque el volumen este
            # montado. Un solo nodo, asi que `localhost` basta.
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
            {{- end }}
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.secrets.rabbitmq.user | default "bank_app" | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-usac.fullname" . }}-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "bank-usac.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "bank-usac.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: metrics
      port: 15692
      targetPort: metrics
{{- end }}
