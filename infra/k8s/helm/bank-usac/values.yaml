# Default values for bank-usac.
#
# Nothing here is a secret. Real credentials live in templates/secret.yaml,
# which reads from the `secrets:` tree below — every leaf there defaults to
# an empty string and is marked `required` in the template, so a bare
# `helm install` with no overrides fails loudly instead of deploying with a
# guessable password. Supply real values with `--set` or (preferred, so
# nothing lands in shell history) `--set-file` / `-f <untracked-file>`, per
# ADR-007's "Secrets reach the cluster through chart values or --set-file,
# never committed."

imagePullPolicy: IfNotPresent

# Modest defaults so five services, a gateway and a frontend fit comfortably
# on kind's single node.
#
# Both of these are per-component overridable: set `replicaCount` or
# `resources` inside any component's block below (services.customer, gateway,
# web, …) and that component uses it while the rest keep these defaults. The
# templates resolve it as `(.Values.<component>.resources | default
# .Values.resources)`, so an absent or empty override inherits rather than
# blanking the block out.
#
# Which components are safe to scale past one replica:
#   gateway, web           — yes. The Gateway's reply queue is named per pod
#                            from the downward API, so replicas do not collide.
#   customer, transaction,
#   payment, notification  — yes. They consume shared durable queues, so the
#                            broker round-robins work across replicas, which is
#                            the intended behaviour.
#   account                — yes, since the sweep lease. It also runs the
#                            inactive-account deactivation job on an interval
#                            (services.account.deactivation), which used to run
#                            N times with N replicas because nothing elected a
#                            single runner. `PostgresSweepLease` now takes a
#                            `pg_try_advisory_lock` before each sweep, so the
#                            replica that gets it sweeps and the others skip
#                            their turn. The lock is held by a session, so a pod
#                            that dies mid-sweep releases it by disconnecting.
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Horizontal Pod Autoscaling (HPA) - Requisito Fase 2:
# Autoescalado con umbral objetivo de 80% de utilización de CPU.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80


# ---------------------------------------------------------------------------
# How pods reach the databases, RabbitMQ and MinIO outside the cluster
# (ADR-007). Both modes keep the same in-cluster DNS names
# (postgres-customer, postgres-account, ..., rabbitmq, minio) — an
# application's DATABASE_URL/RABBITMQ_URL never carries a host address,
# only that name. What differs between modes is the *port* behind that
# name, because the two routes terminate on different things:
#
#   dockerNetwork (default) — the kind nodes were created on the same
#     Docker network as the Compose stack (see ../../kind/cluster.yaml), so
#     each dependency is exposed as a selectorless Service backed by an
#     Endpoints object naming the container's real IP on that network, on
#     its real port (5432, 5672, 9000). Discover the IPs with
#     ../../kind/scripts/discover-external-ips.sh — it writes a values file
#     for `-f`; the placeholders below are deliberately empty so a
#     forgotten discovery step fails the template render, not the pod.
#
#   hostFallback — the shared-network route is unavailable, so the Service
#     becomes `ExternalName` to `host.docker.internal`, which resolves
#     inside kind's nodes without any change to cluster.yaml on Docker
#     Desktop. ExternalName is DNS-only — it cannot remap a port — so the
#     port switches to whatever infra/docker/docker-compose.yml *publishes*
#     on the host for that container. That is a real, documented seam
#     (ADR-007 calls the external connectivity "genuine additional
#     complexity"), not an oversight: it is why the port lives beside the
#     mode instead of being one fixed value.
external:
  mode: dockerNetwork # dockerNetwork | hostFallback

  postgresCustomer:
    dockerNetwork:
      host: "" # required in dockerNetwork mode — see discover-external-ips.sh
      port: 5432
    hostFallback:
      port: 5433 # infra/docker/.env: CUSTOMER_POSTGRES_PORT
  postgresAccount:
    dockerNetwork:
      host: ""
      port: 5432
    hostFallback:
      port: 5434 # ACCOUNT_POSTGRES_PORT
  postgresTransaction:
    dockerNetwork:
      host: ""
      port: 5432
    hostFallback:
      port: 5435 # TRANSACTION_POSTGRES_PORT
  postgresPayment:
    dockerNetwork:
      host: ""
      port: 5432
    hostFallback:
      port: 5436 # PAYMENT_POSTGRES_PORT
  postgresNotificationAudit:
    dockerNetwork:
      host: ""
      port: 5432
    hostFallback:
      port: 5437 # NOTIFICATION_AUDIT_POSTGRES_PORT
  rabbitmq:
    dockerNetwork:
      host: ""
      port: 5672
    hostFallback:
      port: 5673 # RABBITMQ_AMQP_PORT
  minio:
    dockerNetwork:
      host: ""
      port: 9000
    hostFallback:
      port: 9002 # MINIO_API_PORT

# Per-database name and application user (not secret — the matching
# password lives under secrets.databases.<key> below). Values match
# docs/architecture/diagrams/05-uml-despliegue.puml and
# infra/docker/docker-compose.yml's *_POSTGRES_DB / *_POSTGRES_USER.
# MinIO, cuando se levanta dentro del namespace (`minio.inCluster=true`, que
# hoy llega desde los secrets del despliegue y vale para dev y para prod).
#
# La imagen estaba incrustada en el template y apuntaba a
# `quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z`, que **ya no se puede
# descargar**: quay.io devuelve 401 y Docker Hub tambien. MinIO cerro la
# distribucion publica de esa etiqueta. El pod de produccion sigue en pie solo
# porque su imagen se bajo antes del cierre; el dia que se reinicie o se
# reprograme, entra en ImagePullBackOff como entro el de desarrollo.
#
# Se fija por **digest** y no por etiqueta: el unico registro que publica MinIO
# de forma abierta hoy es Chainguard, y su plan gratuito solo etiqueta
# `latest`. Un digest es una referencia inmutable — mas fuerte que una
# etiqueta, y no es la "imagen no versionada" que el enunciado prohibe.
#
# Comprobado como reemplazo directo: mismo entrypoint (`/usr/bin/minio`), los
# mismos `args` del Deployment, `/data` escribible corriendo sin root, y el
# `postStart` que crea el bucket funciona tal cual porque la imagen trae `mc`.
#
# Pendiente (no es para la vispera de una entrega): copiarla al Artifact
# Registry propio con etiqueta versionada, para no depender de que Chainguard
# conserve este digest en su nivel gratuito.
minio:
  image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1

# Sufijo que se anade al nombre de las cinco bases. Vacio en produccion, que
# es quien manda en los nombres; el entorno `dev` lo pone a `_dev` para leer y
# escribir en bases propias sobre las MISMAS VMs. Sin esto los dos entornos
# comparten datos y un despliegue a desarrollo altera produccion, que es
# justo lo que el enunciado prohibe ("no deben afectar el entorno productivo").
#
# Las bases con el sufijo tienen que existir: los servicios corren sus
# migraciones, pero no crean la base. Mientras no existan, dejar esto vacio.
databaseSuffix: ''

# ---------------------------------------------------------------------------
# Telemetry (Fase 3, T-48). Read by `@bank/observability` in the five services
# and the Gateway; the variables they become are listed per component in
# docs/operations/CONTAINERS.md.
#
#   environment     `deployment.environment` on every span and metric and
#                   `environment` on every log line. cd.yml sets it to the
#                   namespace (`dev` / `prod`), which is what keeps the two
#                   environments apart in one Grafana.
#   otlpEndpoint    Where spans and metrics go, over OTLP/HTTP. Empty until the
#                   Collector of T-49 exists: the SDK still records (so logs
#                   carry their traceId and the broker propagates context) and
#                   simply exports nothing.
#   sdkDisabled     The standard kill switch, `OTEL_SDK_DISABLED`.
#   metricExportIntervalMs  How often metrics are pushed. 15 s is enough
#                   resolution for a burn-rate alert.
#   logLevel        `debug`, `info`, `warn` or `error`.
observability:
  environment: local
  otlpEndpoint: ''
  sdkDisabled: false
  metricExportIntervalMs: 15000
  logLevel: info

databases:
  customer:
    name: customer
    user: customer_app
  account:
    name: account
    user: account_app
  transaction:
    name: transaction
    user: transaction_app
  payment:
    name: payment
    user: payment_app
  notificationAudit:
    name: notification_audit
    user: notification_audit_app

# ---------------------------------------------------------------------------
# The five internal domain services. One Deployment + one ClusterIP Service
# each, under templates/<key>/. Ports and required/optional env match the
# matrix in docs/operations/CONTAINERS.md exactly.
#
# `dev` stays the default `image.tag` for every component below — every
# service, the Gateway and web — on purpose, not by oversight. The immutable
# alternative (`build-images.sh`'s short-commit tag) cannot be a static
# default in a committed file: it names a specific commit and goes stale the
# moment another one lands, so hardcoding today's would silently break
# tomorrow's install. And `dev` is not a safe fallback either — read the next
# paragraph before assuming a bare `helm install` works.
#
# `build-images.sh --kind <cluster>` loads *both* names onto the kind node —
# the short-commit tag and `dev` (see `built+=(...)` in the script). That is a
# deliberate fix: loading only the commit tag left a defaulted `helm install`
# failing on `ImagePullBackOff`/`ErrImageNeverPull`, because `dev` names no
# registry and there is nothing on the node to satisfy it.
#
# So a defaulted install now resolves — but it resolves to *whatever was built
# last*, which is not a property to rely on. Pass the tag `build-images.sh`
# printed, every time, so the release names the commit it is running:
#
#   helm upgrade --install bank-usac infra/k8s/helm/bank-usac ... \
#     --set services.customer.image.tag=<short-commit> \
#     --set services.account.image.tag=<short-commit> \
#     --set services.transaction.image.tag=<short-commit> \
#     --set services.payment.image.tag=<short-commit> \
#     --set services.notificationAudit.image.tag=<short-commit> \
#     --set gateway.image.tag=<short-commit> \
#     --set web.image.tag=<short-commit>
#
# (see infra/k8s/README.md for the full command, alongside the required
# secrets). `dev` remains useful for `helm template`/`helm lint`, which never
# touch a cluster and so never hit the pull.
services:
  customer:
    component: customer-service
    port: 3001
    image:
      repository: bank-usac/customer-service
      tag: dev # always --set at install time — see the note above `services:`
  account:
    component: account-service
    port: 3002
    image:
      repository: bank-usac/account-service
      tag: dev # always --set at install time — see the note above `services:`
    # El HPA global (80% de CPU, 1-5 replicas) aplica tambien aqui: el barrido
    # de cuentas inactivas se serializa con un cerrojo consultivo de PostgreSQL
    # (`PostgresSweepLease`), asi que varias replicas no lo ejecutan varias
    # veces.
    deactivation:
      enabled: "true"
      intervalMs: "86400000"
      inactivityMonths: "6"
      inactivityMinBalanceMinor: "5000"
    # T-42: la regla de alta frecuencia. Mas de `maxOperations` debitos y
    # creditos sobre una misma cuenta en `windowMinutes` minutos publican un
    # `account.anomaly.detected.v1`. Los valores por defecto son los que sugiere
    # el enunciado (10 operaciones en 5 minutos). Se cambian aqui y con
    # `helm upgrade`: el Deployment lleva el checksum del ConfigMap, asi que los
    # pods se reinician solos con los valores nuevos, sin tocar codigo.
    anomaly:
      maxOperations: "10"
      windowMinutes: "5"
  transaction:
    component: transaction-service
    port: 3003
    image:
      repository: bank-usac/transaction-service
      tag: dev # always --set at install time — see the note above `services:`
  payment:
    component: payment-service
    port: 3004
    image:
      repository: bank-usac/payment-service
      tag: dev # always --set at install time — see the note above `services:`
    # The ladder docs/events/topology.md fixes: 1 s / 5 s / 30 s. Unlike
    # docker-compose.images.yml this chart does not shorten it for a demo —
    # shorten it explicitly with --set if a live walkthrough needs to.
    retryDelaysMs: "1000,5000,30000"
    # The sweeper's floor: how often it polls while there is work, and how soon
    # after a delivery that may have created some.
    retrySweepMs: "500"
    # Its ceiling while there is none (T-60) is NOT a chart value on purpose:
    # `PAYMENT_RETRY_SWEEP_IDLE_MAX_MS` defaults to 2000 in the service, and every
    # key added to the ConfigMap changes the `checksum/config` annotation that
    # all seven Deployments carry, i.e. rolls the whole release for a tunable
    # nobody needs to touch. To change it in an emergency:
    # `kubectl set env deploy/bank-usac-payment-service PAYMENT_RETRY_SWEEP_IDLE_MAX_MS=500`
    # (equal to `retrySweepMs` turns the idle backoff off).
    # T-60: a realistic CPU request for this service, and the reason it differs
    # from the chart-wide default (50m).
    #
    # At 50m, an idle replica sat on the autoscaler's 80 % threshold (40m): its
    # sweepers polled every 200-500 ms for ever (~25 database transactions a
    # second, 35-50m of CPU on GKE), so the HPA held payment-service at its
    # maximum of 5 replicas with no traffic at all -- 5 x 50m = 250m requested per
    # namespace, doing nothing. With the idle backoff an idle replica measures
    # ~4m locally (12m before) and an estimated 10-17m on an e2-standard-2.
    #
    # 100m puts that idle load at ~15 % of the request, far under the 80 %
    # target, and scales out at 80m -- real traffic, not the pod's own heartbeat.
    # The cost is +50m per replica; at the replica count the system actually
    # needs (1) that is +50m per namespace, against the 150m it gives back by no
    # longer sitting at 5. Limits are the chart default: a burst still gets 250m.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    # T-44: como se porta el proveedor simulado mientras nadie lo cambie. Los tres
    # valores son los de antes de la ficha: ningun fallo, ninguna espera. Un
    # administrador los cambia en caliente con `PUT /api/payments/simulation`
    # (sin reiniciar nada), y ese cambio gana sobre estos valores hasta un
    # `{"reset": true}`. Aplican solo a un pago cuya transferencia no indico un
    # `scenario`. `failureRatePercent` + `timeoutRatePercent` no pueden pasar de 100.
    simulation:
      failureRatePercent: "0"
      timeoutRatePercent: "0"
      latencyMs: "0"
  notificationAudit:
    component: notification-audit-service
    port: 3005
    image:
      repository: bank-usac/notification-audit-service
      tag: dev # always --set at install time — see the note above `services:`
    # OFF by default (T-60, §8.3 "Datos sensibles expuestos"). On, the simulated
    # channel writes the complete activation / password-reset link into the
    # pod's log, and the log agent ships it to Loki, where everyone with
    # Grafana can read a working account-takeover URL. Off, the line still
    # names the link but with the token masked (`/activar?token=***`).
    #
    # The local kind deployment turns it on in infra/k8s/kind/local.values.yaml
    # (and install.sh does for any kind context), because there the log IS the
    # mailbox: with it off nobody can complete a sign-up unless
    # NOTIFICATION_CHANNEL is a real channel (docs/operations/CONTAINERS.md,
    # docs/operations/EMAIL_RESEND.md). Never set it to "true" for a cluster
    # that a stranger can reach.
    revealActivationLinks: "false"
    notificationChannel: simulated
    # The Resend channel's non-sensitive half, read only when
    # notificationChannel is "resend". The API key is the sensitive half and
    # lives in secrets.resendApiKey. With the channel on "resend" and any of
    # these empty, templates/notification-audit/deployment.yaml refuses to
    # render and names the value — the same contract templates/secret.yaml
    # gives the database passwords (docs/operations/EMAIL_RESEND.md).
    resend:
      # A sender on a domain verified in Resend, e.g.
      # "bonking <no-reply@mail.tudominio.com>". An unverified domain is
      # accepted here and rejected by Resend at send time.
      emailFrom: ""
      # The frontend's public origin, prepended to /activar?token=... so the
      # emailed link is absolute. The service cannot know it any other way:
      # it builds a path, and this is what makes it a URL.
      appBaseUrl: ""
      # Never "": RESEND_API_URL is validated as a URL on every boot, the
      # simulated channel included, so an empty value would crash-loop a pod
      # that sends no mail at all. Override only to point a test elsewhere.
      apiUrl: "https://api.resend.com/emails"

# ---------------------------------------------------------------------------
# Gateway — the system's only entry point (constitution V). No DATABASE_URL,
# by design: it holds no business data.
gateway:
  component: gateway
  port: 3000
  # The public entry point of the whole system, and therefore a value that
  # belongs in a file rather than in a `kubectl patch` somebody remembers to
  # run (TD-080). LoadBalancer is the right default because the deployment that
  # needs it is the one that can go silently wrong: on GKE a ClusterIP Gateway
  # deploys green and is reachable by nobody. The local kind install overrides
  # this to ClusterIP in `infra/k8s/scripts/install.sh` — kind has no
  # load-balancer controller, so the Service would sit at `<pending>` forever
  # while the browser comes in through `port-forward.sh` anyway.
  serviceType: LoadBalancer
  # The address reserved by `google_compute_address.gateway` in Terraform.
  # Empty means "give me an ephemeral one", which is what `dev` uses: only
  # production's address is pinned, because it is the one written into the
  # interbank integration agreement with the partner bank. `cd.yml` passes it
  # from the GATEWAY_STATIC_IP repository variable.
  loadBalancerIP: ""
  image:
    repository: bank-usac/gateway
    tag: dev # always --set at install time — see the note above `services:`
  jwtExpiresIn: "3600"
  # No gatewayInstanceId here on purpose. It names this replica's private,
  # broker-exclusive reply queue, so it must differ per pod — it comes from the
  # downward API (metadata.name) in gateway/deployment.yaml. A value pinned
  # here would cap the Gateway at one replica.
  replyTimeoutMs: "5000"
  # The browser reaches web on localhost via kubectl port-forward (see
  # templates/NOTES.txt), so its origin is localhost:<forwarded web port>.
  corsAllowedOrigins: "http://localhost:3010"

# Datos de demostracion: los dos clientes, sus cuatro cuentas con saldo, y los
# usuarios `admin` y `cajero`. "true" es el valor para la demostracion y para
# kind, que es lo que habia antes de que fuera un valor. En un despliegue que
# atienda a gente de verdad, "false": las contrasenas de demostracion son
# publicas. Con "true" el arranque solo CREA lo que falta (INSERT ... ON CONFLICT
# DO NOTHING): jamas sobrescribe un saldo ni un usuario existente, de modo que un
# pod nuevo del HPA no mueve dinero ni deshace un cambio de contrasena.
demo:
  seedData: "true"

# Contrato interbancario v1 (T-56 / T-60). Las dos API keys viven en `secrets:`;
# aqui solo hay configuracion publica del acuerdo de integracion.
interbank:
  # `BANK02` sale del contrato oficial, no de una elección: `BankCode` es
  # `^BANK[0-9]{2}$` y somos el grupo 2. `BANK_USAC` no cumplía el patrón, así
  # que ningún banco pareja habría aceptado un depósito nuestro.
  bankCode: BANK02
  partnerBankCode: BANK99
  # Q10 000,00 en centavos: el máximo por operación que fija el contrato, no una
  # cifra nuestra. Un solo limite para recibir y para enviar; si se supera, el
  # rechazo es `AMOUNT_LIMIT_EXCEEDED`. Gateway y Payment lo leen de la misma
  # clave del ConfigMap, y no se puede subir por encima del techo del contrato.
  maxAmountMinor: "1000000"
  # Base de la API del banco pareja, **con** el sufijo `/interbank/v1`, a donde
  # ESTE banco envia los depositos que origina. La URL del callback ya no se
  # configura: payment-service la deriva. Vacio significa "este despliegue no
  # envia depositos", que es lo correcto mientras no haya pareja asignada: el
  # bloque `interbank` de un pago se ignora y el dinero no sale. Activarlo es un
  # solo valor; el fichero de overrides local lo apunta al Service del mock.
  #
  # T-51 lo aprendio por las malas: sin esta clave en el chart, 240 transferencias
  # interbancarias terminaron como transferencias ordinarias hacia la cuenta de
  # liquidacion y payment-service registro `envio interbancario desactivado`. La
  # ruta respondia 202 todo el tiempo. Un despliegue puede estar mal sin que
  # ninguna peticion lo diga.
  #
  # No hay un valor por defecto condicionado a `partnerMock.enabled`, a
  # proposito: una URL que cambia de sentido segun otra bandera es como un
  # release acaba llamando al banco equivocado.
  partnerBaseUrl: ""
  # OBSOLETA desde TD-095, y se sigue publicando a proposito.
  #
  # Decia "cuanto espera un deposito el callback del banco pareja antes de
  # compensar", y eso ya no lo decide una variable nuestra: lo decide el
  # CONTRATO. Son 180 s de TTL mas un margen de 300 s antes de poder liberar la
  # reserva a ciegas, y payment-service los toma de `V1_TRANSFER_TTL_MS` y
  # `V1_RELEASE_MARGIN_MS`. Con 30 s aqui daba por muerto a los tres minutos un
  # deposito al que el otro banco tiene 24 horas para contestar — y devolvia al
  # cliente dinero que podian haber acreditado.
  #
  # Se mantiene porque el servicio todavia la valida al arrancar. Quitarla del
  # chart es seguro y no hace falta coordinarlo.
  confirmationTimeoutMs: "30000"
  # Cada cuanto se reintenta un paso del protocolo de TIMEOUT que no obtuvo
  # respuesta: consultar `GET /transfers/{id}` o pedir la cancelacion. Esta si
  # es nuestra — el acuerdo dice cuando se puede liberar la reserva, no con que
  # frecuencia preguntamos. Cinco segundos dan unos sesenta intentos dentro del
  # margen de 300 s.
  resolveRetryMs: "5000"

# ---------------------------------------------------------------------------
# partner-bank-mock — the simulated partner bank (T-57).
#
# **`enabled: false`, and that is the whole point.** §4.1 asks for a mock "para
# desarrollar sin depender del otro grupo y para inyectar fallos", and §4.1's
# grading rules allow being evaluated against it as a last resort — so it has to
# be *deployable*, not merely runnable on a laptop. What it must never be is
# deployed by accident into production: a bank that ships its own counterparty
# is a bank that can pass a test it did not really pass.
#
# Turning it on is a values change (`--set partnerMock.enabled=true`), which is
# also how the day-of-grading switch between the real partner, a substitute bank
# and the mock works — no rebuild, no code change. The runbook is
# docs/operations/runbooks/partner-bank.md.
#
# Since T-60 (B8) the mock speaks the OFFICIAL v1 contract in both roles
# (apps/partner-bank-mock/server.mjs documents every variable and route). The
# keys come from the Secret this chart already renders: the mock REQUIRES our
# `interbankApiKeyOutbound` (it is the key we send it) and SENDS our
# `interbankApiKeyInbound` (it is the key the Gateway expects from BANK99).
#
# The `callback*` knobs are the fault injection T-51's mandatory scenario needs.
# They are only the INITIAL state: with `adminToken` set they change at run time
# with `PUT /admin/config` — no restart, which is what made T-51's first
# measurement unreliable (`rollout status` said done while the old pod served).
# Changing them here still changes the Deployment's env, so the pod restarts by
# itself; nothing else reads them.
partnerMock:
  enabled: false
  component: partner-bank-mock
  replicaCount: 1
  image:
    repository: bank-usac/partner-bank-mock
    tag: dev # always --set at install time, like the other components
    pullPolicy: IfNotPresent
  port: 3021
  # Which Gateway the mock talks to (its callbacks and the deposits it
  # originates), WITHOUT the /interbank/v1 prefix: the mock appends it. Empty
  # means the Gateway Service of this same release.
  gatewayUrl: ''
  # Token of the mock's /admin/* API (mode switch, emitter). Empty disables the
  # admin API. Rendered into its own Secret; set it with --set-string or a
  # values file, never commit a real one. test/load/scenario.sh reads it from
  # inside the pod, so nobody has to carry it around.
  adminToken: ''
  # ACCEPT · REJECT · TIMEOUT · SLOW · UNAVAILABLE
  callbackMode: ACCEPT
  callbackDelayMs: "1000"
  # SLOW: delay before the callback.
  callbackSlowMs: "10000"
  # Delay of the 202 itself (a slow receiver). 0 = immediate.
  callbackAckDelayMs: "0"
  # One of the seven contract reasons, for REJECT.
  callbackRejectReason: ACCOUNT_NOT_FOUND
  # PROCESSING · NOT_FOUND · UNREACHABLE — how GET /transfers/{id} and cancel
  # answer for a deposit that has no outcome yet (TIMEOUT mode).
  callbackStatusBehavior: PROCESSING
  # How many of the first operations of each target fail before succeeding, to
  # exercise the retries (ours and the mock's). Targets: result (our callback to
  # the mock), transfer, status, callback (the mock's own callback attempts).
  callbackFailCount: "0"
  callbackFailTargets: result
  # Random failure, in percent, over the same targets.
  callbackFailureRate: "0"
  # false = credit even after expiresAt, to test the late ACCEPTED / reversal path.
  callbackHonorExpiry: "true"
  # COMPLETE · FAIL · STALL — what POST /reversals does.
  callbackReversal: COMPLETE
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ---------------------------------------------------------------------------
# web — the Nuxt frontend. NUXT_PUBLIC_API_BASE_URL is resolved by the
# *browser*, not by the pod, so it must be the address a person's machine
# can reach, not an in-cluster Service name — localhost:<forwarded gateway
# port> when accessed through kubectl port-forward.
web:
  component: web
  port: 3010
  image:
    repository: bank-usac/web
    tag: dev # always --set at install time — see the note above `services:`
  apiBaseUrl: "http://localhost:3000"
  # Optional (T-60). The address of Grafana *as a person's browser reaches it*,
  # like apiBaseUrl above — never an in-cluster Service name. When set, a trace
  # id shown on screen becomes a link to Grafana Explore on Tempo; empty (the
  # default) leaves it as copyable text. Grafana is a ClusterIP Service here, so
  # a cloud deployment has no address to put in it until one is exposed; the kind
  # cluster sets it to the `pnpm obs:forward` port in kind/local.values.yaml.
  grafanaUrl: ""

# ---------------------------------------------------------------------------
# Secrets. Every leaf defaults to "" and templates/secret.yaml wraps each in
# `required`, so an install with no overrides fails at template-render time
# naming exactly what is missing, rather than shipping a working default
# password. Never set real values here — pass them with --set or -f against
# an untracked file.
secrets:
  jwtSecret: ""
  # The one secret that is NOT wrapped in `required`: the default "simulated"
  # channel sends no mail and needs no key. It becomes required — enforced by
  # the notification-audit template, not here — the moment
  # services.notificationAudit.notificationChannel is "resend".
  resendApiKey: ""
  # What Grafana's contact point sends as `Authorization: Bearer ...` to the
  # Gateway's SLO webhook (T-45). Not `required`: without it the webhook refuses
  # everybody, which is the safe default. At least 32 characters when set — the
  # Gateway refuses to start on a shorter one. T-50 supplies it from the pipeline.
  alertWebhookToken: ""
  # Las dos API keys del contrato interbancario oficial (T-56), una por
  # dirección. **No se ponen aquí**: llegan por `--set` desde un canal privado,
  # y vacías significan que la entrada del contrato está cerrada — el guardián
  # responde 401 a todo el mundo, que es preferible a arrancar con una clave que
  # cualquiera adivina.
  interbankApiKeyInbound: ""
  interbankApiKeyOutbound: ""
  # Solo para las rutas heredadas del Gateway con Bearer
  # (/api/interbank/deposits y /callbacks), apagadas por defecto: vacio las
  # mantiene cerradas. payment-service ya NO lo recibe; usa la API key de salida.
  interbankPartnerToken: ""
  rabbitmq:
    user: bank_app # the app account provisioned by infra/docker/scripts/init-rabbitmq.sh
    password: ""
  objectStorage:
    accessKey: ""
    secretKey: ""
    bucket: bank-usac
    region: us-east-1
  databases:
    customer:
      password: ""
    account:
      password: ""
    transaction:
      password: ""
    payment:
      password: ""
    notificationAudit:
      password: ""
