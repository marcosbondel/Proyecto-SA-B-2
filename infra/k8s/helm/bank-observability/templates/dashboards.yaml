{{/*
  Los nueve dashboards de T-50, versionados como JSON en `dashboards/` y
  servidos a Grafana como ConfigMaps.

  Por qué así y no de otra forma: el sidecar de Grafana (`grafana.sidecar.dashboards`)
  recoge CUALQUIER ConfigMap etiquetado `grafana_dashboard: "1"` en cualquier
  namespace, los deja en disco y Grafana los carga al arrancar y en caliente. No
  hace falta una API, ni un token, ni un paso de pipeline que pueda fallar: el
  dashboard llega con el `helm upgrade`, igual que el resto del chart.

  Lo que esto cumple de la rúbrica (criterio 2.6): «dashboards útiles,
  versionados como código». Un dashboard editado en la interfaz de Grafana se
  pierde en el siguiente despliegue — y eso es deliberado. Si alguien mejora un
  panel, el cambio se trae al JSON de este directorio.

  `.Files.Glob` lee el directorio en tiempo de render, así que añadir un
  dashboard es añadir un archivo: nadie tiene que acordarse de tocar esta
  plantilla.
*/}}
{{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
{{- $archivo := base $path }}
{{- $nombre := $archivo | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "bank-dashboard-%s" $nombre | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    # La etiqueta que el sidecar busca. Sin ella el ConfigMap existe y Grafana
    # no se entera.
    grafana_dashboard: "1"
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: bank-usac
  annotations:
    # `folderAnnotation` del sidecar: los nueve caen en la misma carpeta en vez
    # de en la raíz, donde se mezclarían con lo que traigan los subcharts.
    grafana_folder: 'Bank USAC'
data:
  {{ $archivo }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
