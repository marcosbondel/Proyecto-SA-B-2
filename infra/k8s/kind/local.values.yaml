# Sobrescrituras del chart del banco para el clúster local (kind).
#
# POR QUE UN ARCHIVO Y NO UN CAMBIO EN values.yaml. Lo que hay aquí es verdad
# en kind y mentira en la nube: un Collector que vive en el mismo clúster, un
# entorno llamado `local` y un banco pareja que es un doble de prueba. Si
# cualquiera de esas tres cosas estuviera en el `values.yaml` del chart, el
# siguiente despliegue a `prod` la llevaría consigo — y el peor caso no es que
# falle, es que funcione: producción hablando con un mock.
#
# Se usa así:
#
#   pnpm k8s:install -- --values infra/k8s/kind/local.values.yaml
#
# o directamente `pnpm local:up`, que hace todo el camino.
#
# Lo que NO hay que hacer: pasar este archivo a un `helm upgrade` contra GKE.
# `install.sh` ya se niega a trabajar contra un contexto que no sea kind sin
# `--allow-remote-context`, y esa negativa es parte del diseño.

# --------------------------------------------------------------------------
# Telemetría: el Collector está en el mismo clúster, en su propio namespace.
# --------------------------------------------------------------------------
observability:
  # `local`, nunca `dev` ni `prod`. Es la etiqueta que separa entornos en todo
  # dashboard y en toda alerta: si esto dijera `prod`, los datos de una prueba
  # en una laptop se mezclarían con los de producción en el mismo Grafana.
  environment: local
  otlpEndpoint: http://otel-gateway.observability.svc.cluster.local:4318
  # Más resolución que en la nube: en una demo local interesa ver la métrica
  # moverse, y el coste de exportar cada 5 s en kind es irrelevante.
  metricExportIntervalMs: 5000
  logLevel: debug

# --------------------------------------------------------------------------
# El banco pareja, simulado dentro del clúster (T-57).
# --------------------------------------------------------------------------
partnerMock:
  enabled: true
  # De juguete y evidente, como los demás secretos de kind: protege la API
  # `/admin/*` del mock (cambio de modo en caliente, depósitos que origina).
  # `test/load/scenario.sh` lo lee desde dentro del pod, no de aquí.
  adminToken: 'kind-admin-del-mock-de-juguete-no-es-un-secreto'
  # ACCEPT por defecto. Los escenarios de fallo de T-51 ya no reinician el pod:
  # se cambian EN CALIENTE con la API del mock (ver test/load/scenario.sh):
  #   PUT /admin/config {"mode":"REJECT","rejectReason":"ACCOUNT_NOT_FOUND"}
  #   PUT /admin/config {"mode":"TIMEOUT"}
  #   PUT /admin/config {"mode":"SLOW","slowMs":12000}
  # El estado inicial sigue siendo un valor del release:
  #   helm upgrade … --set partnerMock.callbackMode=REJECT
  callbackMode: ACCEPT

interbank:
  # Explícito, no derivado de `partnerMock.enabled`: el destino de un callback
  # es una decisión que se escribe, no una que se adivina.
  callbackUrl: http://bank-usac-partner-bank-mock:3021/callbacks/interbank
  # Y a dónde manda este banco los depósitos que origina: la entrada del mock,
  # que es el `POST /deposits` de `apps/partner-bank-mock`. Sin esto el envío
  # interbancario se queda apagado y una transferencia interbancaria termina
  # como una transferencia interna a la cuenta de liquidación — que es
  # exactamente lo que pasó en la primera corrida de carga de T-51.
  sendUrl: http://bank-usac-partner-bank-mock:3021/deposits

# --------------------------------------------------------------------------
# Dos secretos de juguete, y la palabra «juguete» es literal.
#
# No son secretos: son constantes que solo existen mientras viva un clúster
# kind, escritas aquí para que el camino local se pueda ejercitar de verdad.
# Con el token interbancario vacío —el valor por defecto del chart— la entrada
# del Gateway queda cerrada y el mock recibe 401, que es correcto en producción
# y hace imposible probar el flujo en local.
#
# En la nube estos dos valores llegan por `HELM_SECRETS` desde los secretos del
# repositorio, y este archivo no participa.
#
# `install-observability.sh` lee el de alertas de aquí cuando no está en
# `infra/docker/.env`, para que las dos mitades —quien emite la alerta y quien
# la acepta— no puedan desincronizarse en local.
secrets:
  interbankPartnerToken: 'kind-interbancario-de-juguete-no-es-un-secreto'
  alertWebhookToken: 'kind-alertas-de-juguete-no-es-un-secreto'
  # La API key del contrato interbancario para el camino local. De juguete y
  # evidente, como el resto de los secretos de kind: lo que importa es que la
  # forma del flujo sea la real, no el valor.
  interbankApiKeyInbound: 'kind-api-key-interbancaria-de-juguete'
  interbankApiKeyOutbound: 'kind-api-key-interbancaria-de-juguete'
