loopback_users.guest = false

# definitions.json declares the *topology* — vhost, exchanges, queues, bindings —
# and deliberately nothing else. Its `users` and `permissions` arrays are empty.
#
# They are empty because this file is imported after the node has already
# created RABBITMQ_DEFAULT_USER from the environment, and an imported user wins.
# A definitions file that named `admin` with a literal password would therefore
# overwrite whatever the developer put in infra/docker/.env, and the resulting
# failure is the worst kind: the connection URL carries the new password, the
# broker still expects the old one, and nothing in either file says so.
#
# So the two accounts are created from the environment instead:
#   admin     — by the image, from RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS
#   bank_app  — by the rabbitmq-init service, from RABBITMQ_APP_USER /
#               RABBITMQ_APP_PASSWORD (scripts/init-rabbitmq.sh)
#
# Do not add users back to definitions.json.
management.load_definitions = /etc/rabbitmq/definitions.json
