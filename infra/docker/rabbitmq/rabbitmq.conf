loopback_users.guest = false

# No definitions are loaded here, and that is a fix rather than an omission.
#
# RabbitMQ 4.x does not seed RABBITMQ_DEFAULT_USER when *any* definitions file is
# configured — `load_definitions` and `management.load_definitions` both suppress
# it, even when the file's `users` array is empty. The earlier setup loaded a
# users-less definitions file for the topology and expected the image to still
# create `admin` from the environment; on a fresh volume it never did, so
# `rabbitmq-init` could not authenticate and the whole stack failed to come up
# (only a pre-existing volume that already held `admin` hid it).
#
# The topology does not need pre-loading: every service asserts what it uses on
# startup — the publisher channel declares all four exchanges including
# `bank.errors` (`MessageBroker` constructor), and each `subscribe` declares its
# queue, retry ladder, dead-letter queue and bindings. A service reports ready
# only *after* that finishes, and no traffic flows until every service is ready,
# so there is no cold-start window in which a binding is missing. The canonical
# topology lives in `@bank/contracts` (the `QUEUES` catalogue), which is what the
# services assert from, so a second copy in a definitions file could only drift.
#
# With no definitions file, the image seeds the two default accounts from the
# environment as intended:
#   admin     — by the image, from RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS
#   bank_app  — by the rabbitmq-init service, from RABBITMQ_APP_USER /
#               RABBITMQ_APP_PASSWORD (scripts/init-rabbitmq.sh)
