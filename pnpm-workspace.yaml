# Bank USAC workspace.
#
# Shared dependency versions live ONLY in the catalog below; every package.json
# references them with `catalog:` instead of repeating a range. Each entry was
# checked against OSV (npm ecosystem) on 2026-08-12 with zero known
# vulnerabilities and an active support line — see
# specs/002-monorepo-dev-base/research.md (R8) for the evidence table.
#
# Update rule: before changing a version here, query OSV and run `pnpm audit`.
# A dependency with an open vulnerability does not enter the catalog.

# Every unit of code lives under apps/: the outward-facing applications at the
# top level, the five domain services under apps/services/, and the shared
# packages under apps/packages/. The repository root holds configuration only.
packages:
  - 'apps/*'
  - 'apps/services/*'
  - 'apps/packages/*'

# Forced resolutions for transitive dependencies we do not declare ourselves.
#
# esbuild: `@nuxt/ui > @nuxt/fonts > fontless` pulls 0.27.x, which carries
# GHSA-g7r4-m6w7-qqqr (low; the dev server answers any origin). Patched in
# 0.28.1, and the Nuxt toolchain already resolves 0.28.2 elsewhere in the tree,
# so this only collapses the two copies onto the fixed one. Drop the override
# once @nuxt/fonts ships a release that resolves it on its own.
overrides:
  esbuild: '>=0.28.1'

# Dependencies allowed to run install scripts. Each one belongs to the Nuxt /
# Vite toolchain that `apps/web` already used before the workspace existed;
# they fetch or compile a platform-native binary and cannot work without it.
#
# `@scarf/scarf` is the exception that proves the rule: it arrived transitively
# with the gateway's OpenAPI toolchain and its install script exists only to
# report the installation to a third party. Nothing depends on it running, so
# it does not run. Analytics are not a build step.
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  unrs-resolver: true
  vue-demi: true

catalog:
  # Language and runtime types
  typescript: 6.0.3
  '@types/node': 24.13.3

  # NestJS 11 (services and gateway)
  '@nestjs/cli': 11.0.24
  '@nestjs/common': 11.1.29
  '@nestjs/core': 11.1.29
  '@nestjs/microservices': 11.1.29
  '@nestjs/platform-express': 11.1.29
  '@nestjs/testing': 11.1.29
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

  # Configuration validation
  class-transformer: 0.5.1
  class-validator: 0.15.1

  # Session tokens (gateway only). ADR-010 makes the gateway the sole signer
  # and the sole validator, which is why passport-jwt appears in exactly one
  # application. Checked against OSV (npm ecosystem) on 2026-08-24 with zero
  # known vulnerabilities — see specs/007-api-gateway-web-shell/research.md.
  '@nestjs/jwt': 11.0.2
  '@nestjs/passport': 11.0.5
  passport: 0.7.0
  passport-jwt: 4.0.1
  '@types/passport-jwt': 4.0.1

  # Express request/response types. The gateway augments `Request` with the
  # correlation id and the verified actor, which needs a direct dependency
  # rather than the transitive copy @nestjs/platform-express carries.
  '@types/express': 5.0.6

  # The versioned API contract (gateway only). Decorators produce the document
  # and `yaml` serialises it; a drift test keeps the committed file honest.
  '@nestjs/swagger': 11.4.7
  yaml: 2.9.0

  # Object storage for the identity-document photo (gateway only). MinIO is
  # S3-compatible (ADR-012); this is a transfer buffer, never a database.
  '@aws-sdk/client-s3': 3.1116.0
  '@types/multer': 2.2.0

  # Message contract schemas (@bank/contracts). Checked against OSV (npm
  # ecosystem) and `pnpm audit` on 2026-08-19 with zero known vulnerabilities
  # — see specs/005-event-contracts-saga/research.md (R1).
  zod: 4.4.3

  # PostgreSQL driver (services that own a database). The pool and the SQL are
  # written by hand: an ORM would put schema decisions in a mapping layer, and
  # the per-service database is a boundary this project defends explicitly
  # (constitution II). Checked against OSV (npm ecosystem) on 2026-08-26 with
  # zero known vulnerabilities.
  pg: 8.23.0
  '@types/pg': 8.23.1

  # Messaging transport (technical adapter only)
  amqp-connection-manager: 5.0.0
  amqplib: 2.0.1

  # Testing
  # supertest drives the gateway's routes in-process: the real controllers,
  # guards, filter and middleware run, and only the three ports that cross a
  # process boundary are faked.
  supertest: 7.2.2
  '@types/supertest': 7.2.1
  '@types/jest': 30.0.0
  jest: 30.4.2
  ts-jest: 29.4.12

  # Task runner over the workspace. pnpm still resolves and links the packages;
  # turbo only orders the tasks and caches the ones whose inputs did not move.
  # Root-only dependency — no package.json under apps/ references it.
  turbo: 2.10.12

  # Lint and format
  '@eslint/js': 10.0.1
  eslint: 10.8.1
  eslint-config-prettier: 10.1.8
  prettier: 3.9.6
  typescript-eslint: 8.67.0
