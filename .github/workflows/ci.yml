name: CI

# Fases obligatorias del pipeline de CI (enunciado de la Fase 2, "Flujo de
# Integracion y Despliegue Continuo"): Build, Test y Validacion, cada una un
# job independiente y bloqueante. Un push a feature/** ejecuta las tres; un
# pull request hacia develop repite unicamente Build y Test, tal como pide el
# enunciado ("Se ejecutan nuevamente las fases de: Build, Test") y el ticket
# T-32 ("Repetir build y tests para cambios hacia develop").

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      # `main` tiene que estar aqui aunque el enunciado solo hable de develop.
      # La regla `main_protection` exige que las tres fases reporten antes de
      # permitir un merge, y cubre tanto develop como la rama por defecto. Sin
      # esta linea, un pull request hacia main no dispara CI, los tres checks
      # obligatorios no reportan nunca y el merge se queda bloqueado en
      # `pending` de forma permanente — no falla, que seria mas facil de
      # diagnosticar: simplemente no avanza.
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Fase 1: Build — compilacion del proyecto.
  build:
    name: 'Fase 1: Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Comparte el resultado de la compilacion con las fases siguientes:
      # Turborepo decide por el contenido de este cache si un job posterior
      # necesita recompilar o puede reusar lo ya construido aqui, en vez de
      # que cada fase repita la compilacion desde cero.
      - name: Save Turborepo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}

  # Fase 2: Test — ejecucion de pruebas automatizadas.
  test:
    name: 'Fase 2: Test'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PostgreSQL y RabbitMQ de verdad, para que corran las suites que hasta
    # ahora se saltaban (TD-069). Sin ellos, `describe.skip` dejaba fuera
    # precisamente lo que mas necesita una prueba: la concurrencia con bloqueo
    # de fila, la idempotencia contra una restriccion unica real y los
    # CHECK de la base. Esas suites pasaban a ser verdes sin ejecutarse, que es
    # la peor clase de verde.
    #
    # Las versiones son las mismas de infra/docker/docker-compose.yml: una
    # prueba contra una version de PostgreSQL distinta de la de produccion
    # comprueba algo que nadie va a desplegar.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: bank_test
          POSTGRES_PASSWORD: bank_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bank_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.4-management
        env:
          RABBITMQ_DEFAULT_USER: bank_test
          RABBITMQ_DEFAULT_PASS: bank_test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web's session-guard integration suite drives the real client
      # router in Chromium through @nuxt/test-utils. pnpm installs Playwright
      # itself, but browser binaries and their Linux dependencies are separate.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}

      - name: Test
        run: pnpm test

      - name: Contract tests
        run: pnpm test:contract

      # Una base por servicio, no una compartida: cada servicio corre sus
      # propias migraciones y las cinco escribirian en la misma tabla
      # `schema_migrations`. Son cinco bases dentro de la misma instancia, que
      # es barato, y no cinco instancias.
      - name: Preparar una base de datos por servicio
        env:
          PGPASSWORD: bank_test
        run: |
          set -euo pipefail
          for db in customer account transaction payment notification_audit; do
            psql -h localhost -U bank_test -d postgres -c "CREATE DATABASE $db;"
          done

          # SQL plano y no el macro `\l` del cliente: el psql del runner es mas
          # antiguo que el servidor 18.4 de arriba, y su `\l` pide una columna
          # (`d.daticulocale`) que PostgreSQL 18 ya no tiene. Una consulta
          # explicita no depende de que ambas versiones coincidan.
          psql -h localhost -U bank_test -d postgres \
            -c "SELECT datname FROM pg_database WHERE datistemplate = false ORDER BY datname;"

      # Las suites que `describe.skip` dejaba fuera sin una base y un broker
      # reales: concurrencia con bloqueo de fila, idempotencia contra una
      # restriccion unica, los CHECK de la base y el broker de `@bank/messaging`.
      #
      # `pnpm --filter` en vez de `turbo run`: se salta la cache de Turbo por
      # completo, asi que estas suites se ejecutan siempre. Depende de que el
      # paso `Test` de arriba ya haya compilado las dependencias.
      - name: 'Suites de integracion (PostgreSQL y RabbitMQ reales)'
        env:
          RABBITMQ_URL: amqp://bank_test:bank_test@localhost:5672
        run: |
          set -euo pipefail

          # Las suites asumen una base virgen: crean sus datos y comprueban
          # restricciones unicas contra ellos. Correrlas dos veces sobre la
          # misma base falla por su propio rastro, asi que la comprobacion de
          # "no se salto" se hace sobre la salida de ESTA corrida y no
          # repitiendola.
          run_suite() { # run_suite <paquete> <base de datos>
            echo "::group::$1"
            local output
            output="$(DATABASE_URL="postgresql://bank_test:bank_test@localhost:5432/$2" \
              pnpm --filter "$1" test 2>&1)" || { echo "$output"; echo "::endgroup::"; return 1; }
            echo "$output"
            echo "::endgroup::"

            # Una suite que se salta sola sigue contando como verde. Sin esto,
            # este paso pasaria igual si las variables no hubieran llegado a
            # Jest, y TD-069 quedaria cerrado solo en apariencia.
            if echo "$output" | grep -qE "Test Suites:.*skipped"; then
              echo "::error::$1 salto suites pese a haber PostgreSQL disponible."
              return 1
            fi
          }

          run_suite customer-service            customer
          run_suite account-service             account
          run_suite transaction-service         transaction
          run_suite payment-service             payment
          run_suite notification-audit-service  notification_audit

          echo "::group::@bank/messaging"
          pnpm --filter @bank/messaging test
          echo "::endgroup::"

          # El gateway no declara `DATABASE_URL` — no tiene base de datos, y un
          # test lo comprueba — asi que solo recibe el broker. Lleva su propio
          # guardia por el mismo motivo que los cinco servicios: sus suites
          # contra RabbitMQ se saltan solas en el paso `pnpm test` de arriba,
          # que corre sin broker, y sin esta comprobacion quedarian verdes sin
          # haberse ejecutado jamas.
          echo "::group::gateway"
          gateway_output="$(pnpm --filter gateway test 2>&1)" \
            || { echo "$gateway_output"; echo "::endgroup::"; exit 1; }
          echo "$gateway_output"
          echo "::endgroup::"
          if echo "$gateway_output" | grep -qE "Test Suites:.*skipped"; then
            echo "::error::gateway salto suites pese a haber RabbitMQ disponible."
            exit 1
          fi

      # La forma de la piramide, medida y no afirmada. Cuenta casos ejecutados
      # por cada runner, clasifica por el sufijo `.integration.spec.ts` y falla
      # si una app se desvia de 70/20/10 mas alla de la tolerancia.
      #
      # `--require-executed` es la diferencia entre medir y estimar: aqui hay
      # PostgreSQL y RabbitMQ de verdad, asi que una suite de integracion que se
      # salta no es una circunstancia, es la medicion que no se hizo.
      - name: 'Forma de la piramide de pruebas'
        env:
          RABBITMQ_URL: amqp://bank_test:bank_test@localhost:5672
        run: pnpm test:pyramid --require-executed

      - name: 'Publicar el informe de la piramide'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pyramid
          path: |
            docs/qa/pyramid.json
            docs/qa/pyramid.md
          if-no-files-found: warn

      # ── E2E ──────────────────────────────────────────────────────────────
      #
      # Sigue dentro de la Fase 2 y no en una cuarta: el enunciado nombra tres
      # fases obligatorias y `docs/operations/CI.md` dice que el pipeline las
      # refleja literalmente. Una prueba de extremo a extremo es una prueba, y
      # anadir un job cambiaria la estructura que el enunciado fija.
      #
      # No corre en un pull request hacia `develop`, por el mismo criterio que
      # la Fase 3: levantar trece contenedores en cada iteracion cuesta mas de
      # lo que aporta. Si corre hacia `main`, que es la ultima puerta antes de
      # produccion.
      - name: 'E2E — levantar el stack completo'
        if: >-
          github.event_name != 'pull_request'
          || github.base_ref == 'main'
          || github.base_ref == 'master'
        env:
          SEED_DEMO_DATA: 'true'
          REVEAL_ACTIVATION_LINKS: 'true'
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.dev.yml up -d --wait
          # `--wait` respeta los healthcheck de los contenedores, pero `web` no
          # declara uno, asi que se comprueba a mano antes de abrir el navegador.
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ready >/dev/null \
              && curl -fsS http://localhost:3010/health >/dev/null; then
              echo "stack listo tras $attempt intentos"
              exit 0
            fi
            sleep 5
          done
          echo "::error::El stack no respondio a tiempo."
          docker compose -f infra/docker/docker-compose.dev.yml ps
          exit 1

      - name: 'E2E — correr las suites por flujo'
        if: >-
          github.event_name != 'pull_request'
          || github.base_ref == 'main'
          || github.base_ref == 'master'
        run: node test/e2e/run-all.mjs

      - name: 'E2E — logs del stack cuando algo falla'
        if: failure()
        run: docker compose -f infra/docker/docker-compose.dev.yml logs --tail 200

      - name: 'E2E — publicar evidencia'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e
          path: |
            docs/qa/pyramid-e2e.json
            docs/qa/qa-test-results.json
            docs/qa/screenshots/
          if-no-files-found: warn

  # Fase 3: Validacion — verificacion basica del sistema (sanity check).
  #
  # No se repite en un pull request hacia `develop`: el enunciado pide ahi
  # "Build, Test" y nada mas. Si se repite en uno hacia `main`, que el enunciado
  # no cubre porque no contempla revisar lo que entra a produccion: es la ultima
  # puerta antes del despliegue productivo, y saltarse el lint, el typecheck y
  # el guard de `.env` justo ahi seria la peor eleccion posible de momento para
  # ahorrarse dos minutos.
  validate:
    name: 'Fase 3: Validacion'
    needs: [build, test]
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'main'
      || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}

      # Sanity check: ningun archivo con secretos debe llegar a estar
      # versionado (solo *.env.example esta permitido; ver .gitignore).
      - name: No tracked .env files
        run: |
          tracked_env_files=$(git ls-files -- '*.env' ':!:*.env.example')
          if [ -n "$tracked_env_files" ]; then
            echo "::error::Tracked .env file(s) found — secrets must never be committed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
