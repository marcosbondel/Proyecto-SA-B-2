name: CI

# Fases obligatorias del pipeline de CI (enunciado de la Fase 2, "Flujo de
# Integracion y Despliegue Continuo"): Build, Test y Validacion, cada una un
# job independiente y bloqueante. Un push a feature/** ejecuta las tres; un
# pull request hacia develop repite unicamente Build y Test, tal como pide el
# enunciado ("Se ejecutan nuevamente las fases de: Build, Test") y el ticket
# T-32 ("Repetir build y tests para cambios hacia develop").

on:
  push:
    branches:
      # Toda rama de trabajo, no solo `feature/**`. El enunciado nombra las
      # ramas de funcionalidad, pero el equipo tambien abre `fix/`, `test/`,
      # `docs/` y `chore/`, y sobre esas el push no disparaba nada: su codigo
      # llegaba a `develop` con Build y Test del pull request y sin haber
      # pasado Validacion (lint, typecheck, guard de `.env`) ni una sola vez.
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
      - 'docs/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches:
      - develop
      # `main` tiene que estar aqui aunque el enunciado solo hable de develop.
      # La regla `main_protection` exige que las tres fases reporten antes de
      # permitir un merge, y cubre tanto develop como la rama por defecto. Sin
      # esta linea, un pull request hacia main no dispara CI, los tres checks
      # obligatorios no reportan nunca y el merge se queda bloqueado en
      # `pending` de forma permanente — no falla, que seria mas facil de
      # diagnosticar: simplemente no avanza.
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Fase 1: Build — compilacion del proyecto.
  build:
    name: 'Fase 1: Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Comparte el resultado de la compilacion con las fases siguientes:
      # Turborepo decide por el contenido de este cache si un job posterior
      # necesita recompilar o puede reusar lo ya construido aqui, en vez de
      # que cada fase repita la compilacion desde cero.
      - name: Save Turborepo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}

  # Fase 2: Test — ejecucion de pruebas automatizadas.
  test:
    name: 'Fase 2: Test'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PostgreSQL y RabbitMQ de verdad, para que corran las suites que hasta
    # ahora se saltaban (TD-069). Sin ellos, `describe.skip` dejaba fuera
    # precisamente lo que mas necesita una prueba: la concurrencia con bloqueo
    # de fila, la idempotencia contra una restriccion unica real y los
    # CHECK de la base. Esas suites pasaban a ser verdes sin ejecutarse, que es
    # la peor clase de verde.
    #
    # Las versiones son las mismas de infra/docker/docker-compose.yml: una
    # prueba contra una version de PostgreSQL distinta de la de produccion
    # comprueba algo que nadie va a desplegar.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: bank_test
          POSTGRES_PASSWORD: bank_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bank_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.4-management
        env:
          RABBITMQ_DEFAULT_USER: bank_test
          RABBITMQ_DEFAULT_PASS: bank_test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web's session-guard integration suite drives the real client
      # router in Chromium through @nuxt/test-utils. pnpm installs Playwright
      # itself, but browser binaries and their Linux dependencies are separate.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}

      - name: Test
        run: pnpm test

      - name: Contract tests
        run: pnpm test:contract

      # Una base por servicio, no una compartida: cada servicio corre sus
      # propias migraciones y las cinco escribirian en la misma tabla
      # `schema_migrations`. Son cinco bases dentro de la misma instancia, que
      # es barato, y no cinco instancias.
      - name: Preparar una base de datos por servicio
        env:
          PGPASSWORD: bank_test
        run: |
          set -euo pipefail

          # Dos juegos de bases y no uno. Las suites asumen una base virgen:
          # crean sus datos y comprueban restricciones unicas contra ellos, asi
          # que la segunda corrida sobre la misma base falla por el rastro de la
          # primera. Y hay dos corridas — el paso de abajo, que las ejecuta y
          # exige que ninguna se salte, y el de la piramide, que las vuelve a
          # ejecutar para contar los casos que el runner reporta. Cinco bases mas
          # dentro de la misma instancia cuestan un CREATE DATABASE cada una.
          for db in customer account transaction payment notification_audit; do
            psql -h localhost -U bank_test -d postgres -c "CREATE DATABASE $db;"
            psql -h localhost -U bank_test -d postgres -c "CREATE DATABASE ${db}_pyramid;"
          done

          # SQL plano y no el macro `\l` del cliente: el psql del runner es mas
          # antiguo que el servidor 18.4 de arriba, y su `\l` pide una columna
          # (`d.daticulocale`) que PostgreSQL 18 ya no tiene. Una consulta
          # explicita no depende de que ambas versiones coincidan.
          psql -h localhost -U bank_test -d postgres \
            -c "SELECT datname FROM pg_database WHERE datistemplate = false ORDER BY datname;"

      # Las suites que `describe.skip` dejaba fuera sin una base y un broker
      # reales: concurrencia con bloqueo de fila, idempotencia contra una
      # restriccion unica, los CHECK de la base y el broker de `@bank/messaging`.
      #
      # `pnpm --filter` en vez de `turbo run`: se salta la cache de Turbo por
      # completo, asi que estas suites se ejecutan siempre. Depende de que el
      # paso `Test` de arriba ya haya compilado las dependencias.
      - name: 'Suites de integracion (PostgreSQL y RabbitMQ reales)'
        env:
          RABBITMQ_URL: amqp://bank_test:bank_test@localhost:5672
        run: |
          set -euo pipefail

          # La comprobacion de "no se salto" se hace sobre la salida de ESTA
          # corrida y no repitiendola: la base ya no estaria virgen.
          run_suite() { # run_suite <paquete> <base de datos>
            echo "::group::$1"
            local output
            output="$(DATABASE_URL="postgresql://bank_test:bank_test@localhost:5432/$2" \
              pnpm --filter "$1" test 2>&1)" || { echo "$output"; echo "::endgroup::"; return 1; }
            echo "$output"
            echo "::endgroup::"

            # Una suite que se salta sola sigue contando como verde. Sin esto,
            # este paso pasaria igual si las variables no hubieran llegado a
            # Jest, y TD-069 quedaria cerrado solo en apariencia.
            if echo "$output" | grep -qE "Test Suites:.*skipped"; then
              echo "::error::$1 salto suites pese a haber PostgreSQL disponible."
              return 1
            fi
          }

          run_suite customer-service            customer
          run_suite account-service             account
          run_suite transaction-service         transaction
          run_suite payment-service             payment
          run_suite notification-audit-service  notification_audit

          echo "::group::@bank/messaging"
          pnpm --filter @bank/messaging test
          echo "::endgroup::"

          # El gateway no declara `DATABASE_URL` — no tiene base de datos, y un
          # test lo comprueba — asi que solo recibe el broker. Lleva su propio
          # guardia por el mismo motivo que los cinco servicios: sus suites
          # contra RabbitMQ se saltan solas en el paso `pnpm test` de arriba,
          # que corre sin broker, y sin esta comprobacion quedarian verdes sin
          # haberse ejecutado jamas.
          echo "::group::gateway"
          gateway_output="$(pnpm --filter gateway test 2>&1)" \
            || { echo "$gateway_output"; echo "::endgroup::"; exit 1; }
          echo "$gateway_output"
          echo "::endgroup::"
          if echo "$gateway_output" | grep -qE "Test Suites:.*skipped"; then
            echo "::error::gateway salto suites pese a haber RabbitMQ disponible."
            exit 1
          fi

      # La forma de la piramide, medida y no afirmada. Cuenta casos declarados
      # por cada runner, clasifica por el sufijo `.integration.spec.ts` y falla
      # si una app se desvia de la proporcion mas alla de la tolerancia.
      #
      # `--require-executed` es la diferencia entre medir y estimar: aqui hay
      # PostgreSQL y RabbitMQ de verdad, asi que una suite de integracion que se
      # salta no es una circunstancia, es la medicion que no se hizo. Para que
      # eso sea cierto el script necesita la base, no solo el broker:
      # `pnpm test:pyramid` lanza `jest` como proceso hijo y el hijo hereda este
      # entorno. `{db}` lo sustituye por el nombre que el manifiesto asigna a
      # cada paquete, y son las bases `_pyramid` porque las otras ya las gasto
      # el paso de integracion de arriba.
      #
      # `--without-e2e` por el mismo criterio, aplicado a la capa que este
      # pipeline no ejecuta. El E2E se corre a mano contra el stack completo y
      # su informe queda versionado como evidencia, de modo que aqui siempre hay
      # un `pyramid-e2e.json` de otra maquina y otro dia esperando a que alguien
      # lo tome por una medicion. Sin la bandera, un E2E corto no baja solo su
      # porcentaje: sube los otros dos por el mismo motivo, y saldrian tres
      # desviaciones donde no hay ninguna. Con ella, esa fila se informa pero no
      # se afirma, y lo que se comprueba es la relacion entre las dos capas que
      # esta corrida si midio.
      - name: 'Forma de la piramide de pruebas'
        env:
          RABBITMQ_URL: amqp://bank_test:bank_test@localhost:5672
          PYRAMID_DATABASE_URL_TEMPLATE: postgresql://bank_test:bank_test@localhost:5432/{db}_pyramid
        run: pnpm test:pyramid --require-executed --without-e2e

      - name: 'Publicar el informe de la piramide'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pyramid
          path: |
            docs/qa/pyramid.json
            docs/qa/pyramid.md
          if-no-files-found: warn


  # Fase 3: Validacion — verificacion basica del sistema (sanity check).
  #
  # No se repite en un pull request hacia `develop`: el enunciado pide ahi
  # "Build, Test" y nada mas. Si se repite en uno hacia `main`, que el enunciado
  # no cubre porque no contempla revisar lo que entra a produccion: es la ultima
  # puerta antes del despliegue productivo, y saltarse el lint, el typecheck y
  # el guard de `.env` justo ahi seria la peor eleccion posible de momento para
  # ahorrarse dos minutos.
  validate:
    name: 'Fase 3: Validacion'
    needs: [build, test]
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'main'
      || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}

      # Sanity check: ningun archivo con secretos debe llegar a estar
      # versionado (solo *.env.example esta permitido; ver .gitignore).
      - name: No tracked .env files
        run: |
          tracked_env_files=$(git ls-files -- '*.env' ':!:*.env.example')
          if [ -n "$tracked_env_files" ]; then
            echo "::error::Tracked .env file(s) found — secrets must never be committed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Los dos charts de Helm no se validaban en ningun sitio: `pnpm lint`
      # mira TypeScript, y `pnpm format:check` esta fuera del pipeline porque
      # Prettier no sabe leer las plantillas Go. Un chart que CI no renderiza
      # se rompe en el despliegue, y el de observabilidad ES el despliegue del
      # stack, que §8.3 cobra al 25 % si hay que hacerlo a mano.
      #
      # `lint` solo no basta: pasa sobre un chart cuyo `values.yaml` nombra una
      # clave que ningun subchart conoce. Lo que lo detecta es el render.
      - name: 'Charts de Helm (lint y render)'
        run: |
          set -euo pipefail

          echo "== bank-usac =="
          helm lint infra/k8s/helm/bank-usac
          helm template bank-usac infra/k8s/helm/bank-usac \
            --set secrets.jwtSecret=ci --set secrets.rabbitmq.password=ci \
            --set secrets.objectStorage.accessKey=ci --set secrets.objectStorage.secretKey=ci \
            --set secrets.databases.customer.password=ci \
            --set secrets.databases.account.password=ci \
            --set secrets.databases.transaction.password=ci \
            --set secrets.databases.payment.password=ci \
            --set secrets.databases.notificationAudit.password=ci \
            --set rabbitmq.inCluster=true --set minio.inCluster=true \
            --set external.postgresCustomer.dockerNetwork.host=10.0.0.3 \
            --set external.postgresAccount.dockerNetwork.host=10.0.0.4 \
            --set external.postgresTransaction.dockerNetwork.host=10.0.0.5 \
            --set external.postgresPayment.dockerNetwork.host=10.0.0.6 \
            --set external.postgresNotificationAudit.dockerNetwork.host=10.0.0.7 \
            > /dev/null

          # Y con la entrada publica tal como la despliega produccion, que es
          # la combinacion que TD-080 dejo sin cubrir durante tres semanas.
          helm template bank-usac infra/k8s/helm/bank-usac \
            --set secrets.jwtSecret=ci --set secrets.rabbitmq.password=ci \
            --set secrets.objectStorage.accessKey=ci --set secrets.objectStorage.secretKey=ci \
            --set secrets.databases.customer.password=ci \
            --set secrets.databases.account.password=ci \
            --set secrets.databases.transaction.password=ci \
            --set secrets.databases.payment.password=ci \
            --set secrets.databases.notificationAudit.password=ci \
            --set rabbitmq.inCluster=true --set minio.inCluster=true \
            --set external.postgresCustomer.dockerNetwork.host=10.0.0.3 \
            --set external.postgresAccount.dockerNetwork.host=10.0.0.4 \
            --set external.postgresTransaction.dockerNetwork.host=10.0.0.5 \
            --set external.postgresPayment.dockerNetwork.host=10.0.0.6 \
            --set external.postgresNotificationAudit.dockerNetwork.host=10.0.0.7 \
            --set gateway.loadBalancerIP=203.0.113.10 \
            | grep -q 'loadBalancerIP: "203.0.113.10"'

          # Que rotar una credencial ruede los pods (TD-089). Un pod no vuelve a
          # leer un Secret: sin el hash en el `podTemplate`, una rotacion deja
          # los procesos con el valor anterior y el despliegue sale verde. El
          # script comprueba las dos mitades — que la anotacion este, y que el
          # hash SE MUEVA de verdad al cambiar la credencial, porque una
          # anotacion que apunta a la plantilla equivocada pasa cualquier grep.
          ./infra/k8s/scripts/check-secret-rollout.sh infra/k8s/helm/bank-usac

          echo "== bank-observability =="
          # Los subcharts estan versionados en `charts/`, asi que NO se ejecuta
          # ningun `helm dependency build`: ese comando refresca el indice de
          # los repositorios por red, que es justo lo que versionarlos
          # pretendia evitar. Lo que si hace falta es comprobar que lo
          # versionado concuerde con lo declarado — `helm lint` y
          # `helm template` renderizan felizmente con el .tgz viejo.
          ./infra/k8s/scripts/check-chart-deps.sh infra/k8s/helm/bank-observability

          # Las NetworkPolicy de T-54 contra los pods que los subcharts
          # realmente despliegan. Un `podSelector` que no coincide con nada no
          # es un error de Helm: con el `default-deny` del archivo es el
          # componente incomunicado, y las etiquetas las eligen los subcharts,
          # no nosotros. Se renderizan con `enabled=true` porque en un
          # despliegue normal están apagadas.
          ./infra/k8s/scripts/check-network-policies.sh infra/k8s/helm/bank-observability

          helm lint infra/k8s/helm/bank-observability
          helm template bank-observability infra/k8s/helm/bank-observability \
            --namespace observability > /tmp/obs.yaml

          # Las cuatro cosas que, si se rompen, dejan el stack verde y ciego.
          grep -q 'otlp_http/loki' /tmp/obs.yaml   # los logs salen hacia Loki
          grep -q 'otlp_grpc/tempo' /tmp/obs.yaml  # las trazas salen hacia Tempo
          grep -q 'transform/parse_bank_json' /tmp/obs.yaml  # el JSON del logger se parsea
          grep -q 'matcherType: label' /tmp/obs.yaml         # el salto de un log a su traza
