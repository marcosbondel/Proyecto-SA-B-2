name: Release & Delivery

# Fase de Entrega (Delivery / Release) — Requisito Enunciado Fase 2 (§4.1, p. 7):
# "La fase de entrega se ejecuta en ramas de tipo: release/<version> o mediante
# la creacion de un tag: vX.X.X"
#
# Jobs obligatorios:
#   1. Generacion de version: registro formal de la version del sistema.
#   2. Build y publicacion de imagenes: construccion de las imagenes Docker
#      finales y PUBLICACION en un registry de contenedores.
#
# "Estas imagenes seran las utilizadas en produccion": el job de produccion de
# cd.yml no construye nada, consume la version que este workflow publico. Por eso
# aqui se hace push de verdad (antes se construia y se descartaba) y por eso
# ninguna etiqueta es `latest` — el enunciado lo prohibe explicitamente
# ("No se permite usar imagenes no versionadas").

on:
  push:
    branches:
      - 'release/**'
      - 'release-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version del release (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  # ---------------------------------------------------------------------------
  # Job obligatorio 1: Generacion de version
  # ---------------------------------------------------------------------------
  version:
    name: '1. Generacion de Version'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_version: ${{ steps.calc_version.outputs.version }}
      registry: ${{ steps.calc_version.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Calcular version formal del sistema
        id: calc_version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" =~ ^refs/heads/release/ ]]; then
            VERSION="v${GITHUB_REF#refs/heads/release/}"
          elif [[ "${GITHUB_REF}" =~ ^refs/heads/release- ]]; then
            VERSION="v${GITHUB_REF#refs/heads/release-}"
          else
            VERSION="v$(node -p "require('./package.json').version")-${GITHUB_SHA::8}"
          fi

          # `v1.0.0` y `vv1.0.0` serian dos releases distintos para el registry.
          VERSION="v${VERSION#v}"

          # El mismo Artifact Registry que consume el despliegue: la region es
          # la zona del cluster sin su sufijo de letra (us-central1-a ->
          # us-central1). Publicar en otro registry distinto del que produccion
          # descarga es como esta fase acabo entregando imagenes que nadie podia
          # usar.
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "=== Version formal generada: $VERSION ==="
          echo "=== Registry de destino: $REGISTRY ==="

      - name: Registrar formalmente la version del release
        run: |
          set -euo pipefail
          {
            echo "Registro formal del sistema Bank USAC"
            echo "Version: ${{ steps.calc_version.outputs.version }}"
            echo "Commit:  ${GITHUB_SHA}"
            echo "Rama/Tag: ${GITHUB_REF}"
            echo "Fecha:   $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > release-manifest.txt
          cat release-manifest.txt

      - name: Publicar el manifiesto como artefacto de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.calc_version.outputs.version }}
          path: release-manifest.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job obligatorio 2: Build y publicacion de imagenes
  # ---------------------------------------------------------------------------
  # Una matriz en vez de un bucle: los siete componentes se construyen en
  # paralelo y, cuando uno falla, el log dice cual sin tener que leer 2000
  # lineas de un solo job.
  build-and-publish:
    name: '2. Publicar ${{ matrix.component }}'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: customer-service
            dockerfile: apps/services/customer-service/Dockerfile
          - component: account-service
            dockerfile: apps/services/account-service/Dockerfile
          - component: transaction-service
            dockerfile: apps/services/transaction-service/Dockerfile
          - component: payment-service
            dockerfile: apps/services/payment-service/Dockerfile
          - component: notification-audit-service
            dockerfile: apps/services/notification-audit-service/Dockerfile
          - component: gateway
            dockerfile: apps/gateway/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
          # El banco pareja simulado (T-57). Se publica porque §4.1 admite
          # evaluar contra el mock como ultimo recurso si el banco pareja no
          # esta disponible, y ese ultimo recurso tiene que existir en el
          # registro. El chart lo deja APAGADO (`partnerMock.enabled=false`):
          # publicar una imagen no es desplegarla.
          - component: partner-bank-mock
            dockerfile: apps/partner-bank-mock/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # La misma autenticacion sin llave que usa el despliegue: la organizacion
      # prohibe crear llaves de cuenta de servicio
      # (`constraints/iam.disableServiceAccountKeyCreation`).
      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Autenticar Docker contra Artifact Registry
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # `push: true` es la diferencia con la version anterior de este workflow,
      # que construia las siete imagenes y las descartaba al terminar el job.
      - name: Build y push de la imagen versionada
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ needs.version.outputs.registry }}/${{ matrix.component }}:${{ needs.version.outputs.release_version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Confirmar que la imagen quedo publicada
        run: |
          set -euo pipefail
          IMAGE="${{ needs.version.outputs.registry }}/${{ matrix.component }}:${{ needs.version.outputs.release_version }}"
          echo "Verificando $IMAGE en el registry…"
          docker buildx imagetools inspect "$IMAGE" > /dev/null
          echo "OK: $IMAGE esta publicada y es accesible."

  # ---------------------------------------------------------------------------
  # Cierre: el registro formal de que las siete imagenes existen en el registry.
  # ---------------------------------------------------------------------------
  release-summary:
    name: '3. Resumen del Release'
    needs: [version, build-and-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumen
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.release_version }}"
          REGISTRY="${{ needs.version.outputs.registry }}"

          {
            echo "## Release \`$VERSION\` publicado"
            echo ""
            echo "Imagenes disponibles en \`${REGISTRY}\` (ninguna etiquetada \`latest\`):"
            echo ""
            for c in customer-service account-service transaction-service \
                     payment-service notification-audit-service gateway web; do
              echo "- \`${REGISTRY}/${c}:${VERSION}\`"
            done
            echo ""
            echo "Estas son las imagenes que el job de produccion de \`cd.yml\` consume al mergear a \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
