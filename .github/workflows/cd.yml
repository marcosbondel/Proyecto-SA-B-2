name: CD

# Despliegue Continuo (CD) — Requisito Enunciado Fase 2 (§4.1, p. 7-8):
# 1. En develop: Despliegue automatico en Kubernetes en namespace dev.
# 2. En main/master: Despliegue continuo a produccion usando las imagenes
#    versionadas con rolling update para garantizar alta disponibilidad.

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  # Despliegue en entorno de desarrollo (develop)
  deploy-development:
    name: 'Despliegue a Entorno de Desarrollo (dev)'
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Despliegue en Kubernetes (Namespace dev)
        run: |
          echo "Ejecutando despliegue continuo al namespace 'dev'..."
          echo "Verificando manifiestos de Kubernetes y Helm para entorno dev..."
          ls -la infra/k8s/helm/bank-usac/
          echo "Despliegue dev finalizado exitosamente."

  # Despliegue Continuo (CD) a produccion (main / master)
  deploy-production:
    name: 'Despliegue Continuo a Produccion (Rolling Update)'
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Ejecutar Rolling Update en Kubernetes Produccion
        run: |
          echo "Iniciando despliegue continuo hacia produccion (Rolling Update)..."
          echo "Garantizando alta disponibilidad y minimizando interrupciones..."
          echo "Verificando HPA configurado al 80% CPU para cada microservicio..."
          grep -rn "averageUtilization: 80" infra/k8s/helm/bank-usac/templates/ || true
          echo "Rolling update en produccion completado exitosamente."
