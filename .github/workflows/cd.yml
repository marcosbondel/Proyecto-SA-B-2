name: CD

# Despliegue Continuo (CD) — Requisito Enunciado Fase 2 (§4.1, p. 7-8):
#
#   1. Tras el merge en `develop`: construccion de imagenes Docker, etiquetado y
#      despliegue en Kubernetes en el namespace de desarrollo (`dev`). "Los
#      cambios deben ser visibles en el entorno de desarrollo. No deben afectar
#      el entorno productivo."
#   2. Al mergear hacia `main`/`master`: despliegue a produccion. "El pipeline
#      utilizara las imagenes previamente generadas" (por release.yml), "se
#      actualizaran los deployments en Kubernetes" y "se ejecutara un rolling
#      update".
#
# Ambos jobs despliegan de verdad contra GKE. Si faltan las credenciales, el job
# FALLA diciendo cual falta — no imprime un exito que no ocurrio. Un CD que
# reporta verde sin desplegar es peor que uno rojo: esconde el problema.
#
# Secrets/variables que este workflow necesita (Settings > Secrets and variables):
# Autenticacion — hace falta UNO de los dos caminos:
#   var    WIF_PROVIDER      (preferido) el Workload Identity Provider, de la
#                            forma projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<prov>
#   var    WIF_SERVICE_ACCOUNT  el correo de la cuenta de servicio a suplantar
#     — o bien —
#   secret GCP_SA_KEY        JSON de una service account con roles
#                            container.developer y artifactregistry.writer.
#                            Imposible de crear si la organizacion aplica
#                            `constraints/iam.disableServiceAccountKeyCreation`;
#                            en ese caso, usar WIF.
#   var    GCP_PROJECT_ID    id del proyecto de GCP
#   var    GKE_CLUSTER       nombre del cluster  (terraform: bank-usac-vpc-gke)
#   var    GKE_ZONE          zona del cluster    (terraform: us-central1-a)
#   var    ARTIFACT_REPO     repositorio de Artifact Registry (ej. bank-images)
#   var    GATEWAY_PUBLIC_URL  la direccion del Gateway tal como la alcanza el
#                            navegador (terraform: gateway_public_url)
#   var    WEB_PUBLIC_URL    opcional — origen del frontend, para el CORS del
#                            Gateway
#   secret HELM_SECRETS      valores `--set` de secrets.* que pide el chart,
#                            uno por linea (ver infra/k8s/scripts/install.sh)
#   secret INFRA_ADDRESSES   direcciones de la infraestructura fuera del
#                            cluster (las VMs de PostgreSQL, RabbitMQ, MinIO),
#                            una por linea; las da `terraform output`

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:
    inputs:
      retire_dev:
        description: 'Retirar el entorno de desarrollo (libera su CPU reservada)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  CHART_PATH: infra/k8s/helm/bank-usac
  # La etiqueta de las imagenes de desarrollo, definida UNA vez. La construccion
  # y el despliegue la leen de aqui: cuando cada job la recomponia por su cuenta
  # se construia `dev-<sha corto>` y se desplegaba `dev-<sha completo>`, una
  # etiqueta que no existe en el registry.
  DEV_IMAGE_TAG: dev-${{ github.sha }}
  COMPONENTS: 'customer-service account-service transaction-service payment-service notification-audit-service gateway web'

jobs:
  # ===========================================================================
  # Comprobacion previa. Separada a proposito: decide si hay con que desplegar
  # ANTES de construir nada, y deja el motivo escrito en el resumen de la
  # corrida en vez de en la linea 400 de un log.
  # ===========================================================================
  preflight:
    name: 'Verificacion de credenciales'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Comprobar secrets y variables
        id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
          GKE_ZONE: ${{ vars.GKE_ZONE }}
          ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
          GATEWAY_PUBLIC_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
          HELM_SECRETS: ${{ secrets.HELM_SECRETS }}
          INFRA_ADDRESSES: ${{ secrets.INFRA_ADDRESSES }}
        run: |
          set -euo pipefail
          missing=()
          # Basta con UNO de los dos caminos de autenticacion. Se prefiere
          # Workload Identity Federation: no hay llave que guardar, y es el
          # unico posible cuando la organizacion prohibe crearlas.
          if [ -n "${WIF_PROVIDER}" ]; then
            [ -n "${WIF_SERVICE_ACCOUNT}" ] || missing+=("variable WIF_SERVICE_ACCOUNT (requerida junto a WIF_PROVIDER)")
          elif [ -z "${GCP_SA_KEY}" ]; then
            missing+=("autenticacion: o bien las variables WIF_PROVIDER + WIF_SERVICE_ACCOUNT, o bien el secret GCP_SA_KEY")
          fi
          [ -n "${GCP_PROJECT_ID}"  ] || missing+=("variable GCP_PROJECT_ID")
          [ -n "${GKE_CLUSTER}"     ] || missing+=("variable GKE_CLUSTER")
          [ -n "${GKE_ZONE}"        ] || missing+=("variable GKE_ZONE")
          [ -n "${ARTIFACT_REPO}"   ] || missing+=("variable ARTIFACT_REPO")
          [ -n "${GATEWAY_PUBLIC_URL}" ] || missing+=("variable GATEWAY_PUBLIC_URL")
          [ -n "${HELM_SECRETS}"    ] || missing+=("secret HELM_SECRETS")
          [ -n "${INFRA_ADDRESSES}" ] || missing+=("secret INFRA_ADDRESSES")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CD no puede desplegar todavia"
              echo ""
              echo "Falta configurar en *Settings > Secrets and variables > Actions*:"
              echo ""
              printf '-  `%s`\n' "${missing[@]}"
              echo ""
              echo "Los valores del cluster estan en \`infra/terraform/gcp/\`:"
              echo "cluster \`bank-usac-vpc-gke\`, zona \`us-central1-a\`."
              echo ""
              echo "Si tu organizacion prohibe crear llaves de cuenta de servicio,"
              echo "usa Workload Identity Federation: ver \`docs/operations/CI.md\`."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::CD sin credenciales de GCP. Faltan: ${missing[*]}"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Credenciales presentes. Continuando con el despliegue."

  # ===========================================================================
  # Que componentes cambio este merge. Workflow reutilizable (`changes.yml`):
  # la lista de rutas por componente es la definicion de la estrategia de
  # monorepo y tenerla dos veces es como se llega a que un servicio se
  # despliegue desde un workflow y no desde el otro.
  # ===========================================================================
  changes:
    name: 'Componentes modificados'
    needs: preflight
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/changes.yml

  # ===========================================================================
  # Construccion selectiva: una imagen por componente MODIFICADO, en paralelo.
  #
  # Con la matriz sobre `needs.changes`, un cambio en `payment-service`
  # construye una imagen en vez de siete; y cuando una falla, el nombre del job
  # dice cual sin tener que leer el log entero.
  # ===========================================================================
  build-development:
    name: 'Construir ${{ matrix.component }}'
    needs: [preflight, changes]
    if: github.ref == 'refs/heads/develop' && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Calcular registry, etiqueta y Dockerfile
        id: meta
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}"
          COMPONENT='${{ matrix.component }}'

          case "$COMPONENT" in
            gateway) DOCKERFILE='apps/gateway/Dockerfile' ;;
            web)     DOCKERFILE='apps/web/Dockerfile' ;;
            *)       DOCKERFILE="apps/services/${COMPONENT}/Dockerfile" ;;
          esac

          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

          echo "image=${REGISTRY}/${COMPONENT}:${DEV_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `cache-from`/`cache-to` con alcance por componente: cada imagen reusa
      # sus propias capas y no invalida las de las otras seis.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.DEV_IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # ===========================================================================
  # Despliegue al entorno de desarrollo (merge a develop -> namespace `dev`).
  #
  # Las imagenes de los componentes que NO cambiaron ya estan en el registry de
  # corridas anteriores; el chart recibe la etiqueta nueva solo para los que se
  # acaban de construir, y conserva la que tuviera cada uno de los demas
  # (`UPDATED_COMPONENTS` en helm-deploy.sh). Eso es lo que hace selectivo al
  # despliegue y no solo a la construccion.
  # ===========================================================================
  deploy-development:
    name: 'Despliegue Continuo a Desarrollo (dev)'
    needs: [preflight, changes, build-development]
    if: github.ref == 'refs/heads/develop' && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obtener credenciales del cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Desplegar en Kubernetes (namespace dev)
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          IMAGE_REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}" \
            bash .github/scripts/helm-deploy.sh
        env:
          NAMESPACE: dev
          RELEASE_NAME: bank-usac-dev
          IMAGE_TAG: ${{ env.DEV_IMAGE_TAG }}
          # Broker propio del namespace. Redundante — los secrets del
          # despliegue ya traen `rabbitmq.inCluster=true` para los dos
          # entornos — pero deja escrito en el workflow lo que hoy solo se
          # sabe leyendo un secreto.
          IN_CLUSTER_BROKER: 'true'
          # Bases propias sobre las mismas VMs. Se queda vacio hasta que las
          # cinco bases `<nombre>_dev` existan; entonces basta con definir la
          # variable DEV_DATABASE_SUFFIX del repositorio como `_dev`.
          DATABASE_SUFFIX: ${{ vars.DEV_DATABASE_SUFFIX }}
          # Que helm diga por que recurso espera. Tres despliegues seguidos
          # caducaron con los ocho Deployments del release en 1/1 Running, y
          # sin esto el log no dice a quien esperaba.
          HELM_WAIT_DEBUG: 'true'
          UPDATED_COMPONENTS: ${{ join(fromJSON(needs.changes.outputs.components), ' ') }}
          HELM_SECRETS: ${{ secrets.HELM_SECRETS }}
          INFRA_ADDRESSES: ${{ secrets.INFRA_ADDRESSES }}
          GATEWAY_PUBLIC_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Despliegue a \`dev\`"
            echo ""
            echo "${{ needs.changes.outputs.reason }}"
            echo ""
            echo "Componentes actualizados: \`${{ join(fromJSON(needs.changes.outputs.components), '`, `') }}\`"
            echo ""
            echo "Los demas conservan la etiqueta que ya tenian en el release."
          } >> "$GITHUB_STEP_SUMMARY"






  # ===========================================================================
  # Retirada del entorno de desarrollo, a mano y solo si hace falta.
  #
  # `dev` se retiro una vez porque el cluster corria UN nodo y tres copias de la
  # aplicacion no cabian: el nodo llego al 99% de CPU *reservada* usando el 11%
  # real, y produccion se quedo con siete pods en `FailedScheduling:
  # Insufficient cpu`. Con el pool en los tres nodos que declara
  # `infra/terraform/gcp/variables.tf` vuelve a caber, y el despliegue a `dev`
  # de arriba esta activo otra vez.
  #
  # Este job se queda como la valvula de escape: libera los 450m que `dev`
  # reserva, desde Actions > CD > Run workflow marcando `retire_dev`, sin que
  # nadie necesite acceso a gcloud.
  #
  # Es idempotente — `helm uninstall` de un release que no existe no es un
  # error — asi que volver a lanzarlo no rompe nada.
  # ===========================================================================
  retire-development:
    name: 'Retirar el entorno de desarrollo (dev)'
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.retire_dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obtener credenciales del cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Retirar el release de desarrollo
        run: |
          set -euo pipefail

          echo "=== CPU reservada ANTES ==="
          kubectl describe nodes | grep -A6 "Allocated resources" || true

          if helm status bank-usac-dev --namespace dev >/dev/null 2>&1; then
            helm uninstall bank-usac-dev --namespace dev --wait --timeout 10m
            echo "Release bank-usac-dev retirado."
          else
            echo "No hay release bank-usac-dev en el namespace dev; nada que retirar."
          fi

          kubectl delete namespace dev --ignore-not-found --wait --timeout=5m

          echo "=== CPU reservada DESPUES ==="
          kubectl describe nodes | grep -A6 "Allocated resources" || true


  deploy-production:
    name: 'Despliegue Continuo a Produccion (Rolling Update)'
    needs: preflight
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determinar la version publicada a desplegar
        id: version
        run: |
          set -euo pipefail
          # La ultima version formal que release.yml publico. Sin tag no hay
          # nada que desplegar: produccion no improvisa una imagen.
          VERSION="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"

          if [ -z "$VERSION" ]; then
            echo "::error::No hay ningun tag vX.X.X. Produccion solo despliega imagenes publicadas por release.yml."
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Desplegando la version publicada $VERSION"

      # Dos caminos de autenticacion, y el primero es el preferido.
      #
      # Workload Identity Federation intercambia el token OIDC que GitHub emite
      # para esta corrida por credenciales de GCP de corta vida. No hay ninguna
      # llave que guardar, rotar ni filtrar — y es el unico camino disponible
      # cuando la organizacion aplica `constraints/iam.disableServiceAccountKeyCreation`,
      # que prohibe descargar llaves JSON. Necesita `id-token: write`, arriba.
      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # El camino con llave, para un proyecto sin esa restriccion.
      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obtener credenciales del cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Rolling update en produccion
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          IMAGE_REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}" \
            bash .github/scripts/helm-deploy.sh
        env:
          NAMESPACE: prod
          RELEASE_NAME: bank-usac
          IMAGE_TAG: ${{ steps.version.outputs.value }}
          HELM_SECRETS: ${{ secrets.HELM_SECRETS }}
          INFRA_ADDRESSES: ${{ secrets.INFRA_ADDRESSES }}
          GATEWAY_PUBLIC_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
          # Mide la disponibilidad mientras el rolling update ocurre. El chart
          # declara `maxUnavailable: 0`; esto es lo que lo demuestra.
          ZERO_DOWNTIME_PROBE_URL: ${{ vars.GATEWAY_PUBLIC_URL }}/health

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Produccion actualizada a \`${{ steps.version.outputs.value }}\`"
            echo ""
            echo "Rolling update completado en el namespace \`prod\`, con las imagenes"
            echo "publicadas por \`release.yml\`. Ninguna imagen fue construida aqui."
          } >> "$GITHUB_STEP_SUMMARY"
