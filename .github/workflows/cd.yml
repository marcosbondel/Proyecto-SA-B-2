name: CD

# Despliegue Continuo (CD) — Requisito Enunciado Fase 2 (§4.1, p. 7-8):
#
#   1. Tras el merge en `develop`: construccion de imagenes Docker, etiquetado y
#      despliegue en Kubernetes en el namespace de desarrollo (`dev`). "Los
#      cambios deben ser visibles en el entorno de desarrollo. No deben afectar
#      el entorno productivo."
#   2. Al mergear hacia `main`/`master`: despliegue a produccion. "El pipeline
#      utilizara las imagenes previamente generadas" (por release.yml), "se
#      actualizaran los deployments en Kubernetes" y "se ejecutara un rolling
#      update".
#
# Ambos jobs despliegan de verdad contra GKE, y la regla es que este workflow
# NUNCA imprima un despliegue que no ocurrio. Un CD que reporta verde sin
# desplegar es peor que uno rojo: esconde el problema. De ahi dos casos que se
# tratan distinto a proposito:
#
#   sin credenciales    -> el job FALLA diciendo cual falta. Es un error de
#                          configuracion humano y merece una cruz roja.
#   sin infraestructura -> los jobs de construccion y despliegue se OMITEN, con
#                          el motivo y el remedio en el resumen de la corrida.
#                          La infraestructura de este proyecto se enciende y se
#                          apaga a proposito (cuesta ~0.50 USD/hora), asi que su
#                          ausencia no es un defecto del commit. Omitir no es
#                          reportar exito: un job omitido se distingue a simple
#                          vista de uno que paso.
#
# Antes de esto, cada merge a `develop` fallaba en el primer `docker push` con
# «Repository bank-images not found» — rojo en todos los merges desde el
# 2026-10-06. Un check permanentemente rojo no informa: cuando el CD se rompa de
# verdad, nadie lo va a notar.
#
# Secrets/variables que este workflow necesita (Settings > Secrets and variables):
# Autenticacion — hace falta UNO de los dos caminos:
#   var    WIF_PROVIDER      (preferido) el Workload Identity Provider, de la
#                            forma projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<prov>
#   var    WIF_SERVICE_ACCOUNT  el correo de la cuenta de servicio a suplantar
#     — o bien —
#   secret GCP_SA_KEY        JSON de una service account con roles
#                            container.developer y artifactregistry.writer.
#                            Imposible de crear si la organizacion aplica
#                            `constraints/iam.disableServiceAccountKeyCreation`;
#                            en ese caso, usar WIF.
#   var    GCP_PROJECT_ID    id del proyecto de GCP
#   var    GKE_CLUSTER       nombre del cluster  (terraform: bank-usac-vpc-gke)
#   var    GKE_ZONE          zona del cluster    (terraform: us-central1-c)
#   var    ARTIFACT_REPO     repositorio de Artifact Registry (ej. bank-images)
#   var    GATEWAY_PUBLIC_URL  la direccion del Gateway tal como la alcanza el
#                            navegador (terraform: gateway_public_url)
#   var    GATEWAY_STATIC_IP opcional, solo produccion — la IP reservada
#                            (terraform: gateway_public_ip). Fija la direccion
#                            del Service LoadBalancer para que la entrada
#                            publica sobreviva a un reinstalado (TD-080)
#   var    CLOUD_RUN_SERVICE opcional — nombre del servicio de Cloud Run del
#                            frontend (terraform: cloud_run_service_name). Sin
#                            ella, el portal publico no se actualiza (TD-081)
#   var    WEB_PUBLIC_URL    opcional — origen del frontend, para el CORS del
#                            Gateway
#   var    OTEL_EXPORTER_OTLP_ENDPOINT  opcional — solo para apuntar a un
#                            Collector que no sea el del cluster. Por defecto se
#                            usa el que instala el job `deploy-observability`:
#                            http://otel-gateway.observability.svc.cluster.local:4318
#   var    INTERBANK_PARTNER_BASE_URL   opcional, solo produccion — la URL
#                            base `/interbank/v1` del banco pareja. Sin ella, el
#                            mock de este release
#   var    INTERBANK_PARTNER_BANK_CODE  opcional, solo produccion — su codigo
#                            (`BANKnn`). Sin ella, `BANK99` (el mock)
#   secret INTERBANK_API_KEY_OUTBOUND   opcional, solo produccion — la clave
#                            que el banco pareja nos emitio. Gana sobre la de
#                            HELM_SECRETS
#   secret HELM_SECRETS      valores `--set` de secrets.* que pide el chart,
#                            uno por linea (ver infra/k8s/scripts/install.sh)
#   secret INFRA_ADDRESSES   direcciones de la infraestructura fuera del
#                            cluster (las VMs de PostgreSQL, RabbitMQ, MinIO),
#                            una por linea; las da `terraform output`
#   secret GRAFANA_ADMIN_PASSWORD  la contrasena de `admin` en Grafana (T-49).
#                            Sin ella el job de observabilidad falla diciendolo,
#                            en vez de instalar un Grafana con la contrasena
#                            que el chart trae por defecto. Tambien la usa la
#                            anotacion de release, por port-forward
#   secret ALERT_WEBHOOK_TOKEN  el secreto compartido del webhook de alertas
#                            (T-60), 32 caracteres o mas. El job de
#                            observabilidad crea con el el Secret
#                            `grafana-alert-webhook` y falla si falta; los dos
#                            despliegues del banco lo pasan al Gateway
#   var    OBS_NETWORK_POLICIES  opcional — `true` enciende las NetworkPolicy
#                            del stack en cada despliegue (exige Dataplane V2;
#                            si el cluster no lo tiene, se avisa y quedan
#                            apagadas)

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:
    inputs:
      retire_dev:
        description: 'Retirar el entorno de desarrollo (libera su CPU reservada)'
        type: boolean
        default: false
      deploy_observability:
        description: 'Desplegar el stack de observabilidad (Collector, Prometheus, Tempo, Loki, Grafana)'
        type: boolean
        default: false
      network_policies:
        description: 'Con deploy_observability: encender las NetworkPolicy del stack (exige Dataplane V2). Para dejarlas encendidas en cada merge, la variable OBS_NETWORK_POLICIES=true'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  CHART_PATH: infra/k8s/helm/bank-usac
  # La etiqueta de las imagenes de desarrollo, definida UNA vez. La construccion
  # y el despliegue la leen de aqui: cuando cada job la recomponia por su cuenta
  # se construia `dev-<sha corto>` y se desplegaba `dev-<sha completo>`, una
  # etiqueta que no existe en el registry.
  DEV_IMAGE_TAG: dev-${{ github.sha }}
  COMPONENTS: 'customer-service account-service transaction-service payment-service notification-audit-service gateway web'

jobs:
  # ===========================================================================
  # Comprobacion previa. Separada a proposito: decide si hay con que desplegar
  # ANTES de construir nada, y deja el motivo escrito en el resumen de la
  # corrida en vez de en la linea 400 de un log.
  # ===========================================================================
  preflight:
    name: 'Verificacion de credenciales e infraestructura'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      infra_ready: ${{ steps.infra.outputs.ready }}
    steps:
      - name: Comprobar secrets y variables
        id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
          GKE_ZONE: ${{ vars.GKE_ZONE }}
          ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
          GATEWAY_PUBLIC_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
          HELM_SECRETS: ${{ secrets.HELM_SECRETS }}
          INFRA_ADDRESSES: ${{ secrets.INFRA_ADDRESSES }}
        run: |
          set -euo pipefail
          missing=()
          # Basta con UNO de los dos caminos de autenticacion. Se prefiere
          # Workload Identity Federation: no hay llave que guardar, y es el
          # unico posible cuando la organizacion prohibe crearlas.
          if [ -n "${WIF_PROVIDER}" ]; then
            [ -n "${WIF_SERVICE_ACCOUNT}" ] || missing+=("variable WIF_SERVICE_ACCOUNT (requerida junto a WIF_PROVIDER)")
          elif [ -z "${GCP_SA_KEY}" ]; then
            missing+=("autenticacion: o bien las variables WIF_PROVIDER + WIF_SERVICE_ACCOUNT, o bien el secret GCP_SA_KEY")
          fi
          [ -n "${GCP_PROJECT_ID}"  ] || missing+=("variable GCP_PROJECT_ID")
          [ -n "${GKE_CLUSTER}"     ] || missing+=("variable GKE_CLUSTER")
          [ -n "${GKE_ZONE}"        ] || missing+=("variable GKE_ZONE")
          [ -n "${ARTIFACT_REPO}"   ] || missing+=("variable ARTIFACT_REPO")
          [ -n "${GATEWAY_PUBLIC_URL}" ] || missing+=("variable GATEWAY_PUBLIC_URL")
          [ -n "${HELM_SECRETS}"    ] || missing+=("secret HELM_SECRETS")
          [ -n "${INFRA_ADDRESSES}" ] || missing+=("secret INFRA_ADDRESSES")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CD no puede desplegar todavia"
              echo ""
              echo "Falta configurar en *Settings > Secrets and variables > Actions*:"
              echo ""
              printf '-  `%s`\n' "${missing[@]}"
              echo ""
              echo "Los valores del cluster estan en \`infra/terraform/gcp/\`:"
              echo "cluster \`bank-usac-vpc-gke\`, zona \`us-central1-c\`."
              echo ""
              echo "Si tu organizacion prohibe crear llaves de cuenta de servicio,"
              echo "usa Workload Identity Federation: ver \`docs/operations/CI.md\`."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::CD sin credenciales de GCP. Faltan: ${missing[*]}"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Credenciales presentes. Continuando con el despliegue."

      # ---------------------------------------------------------------------
      # Y ahora la otra mitad de la pregunta: existe el destino?
      #
      # Tener credenciales no es tener donde desplegar. Desde que la
      # infraestructura se dio de baja, CADA merge a `develop` fallaba en el
      # primer `docker push` con «Repository bank-images not found» — rojo en
      # todos los merges desde el 2026-10-06. Un check que siempre esta rojo no
      # informa de nada: cuando el CD se rompa por un motivo real, nadie lo va a
      # notar entre el ruido.
      #
      # La distincion que se mantiene, porque es la que importa:
      #
      #   sin credenciales      -> FALLA. Es un error de configuracion humano y
      #                            merece una cruz roja.
      #   sin infraestructura   -> se OMITE, con el motivo escrito en el resumen.
      #                            El commit no tiene nada de malo; lo que falta
      #                            es un entorno, y omitir no es reportar exito.
      #
      # Sigue sin existir ningun camino por el que esto imprima un despliegue
      # que no ocurrio, que es la regla de docs/operations/CI.md.
      # ---------------------------------------------------------------------
      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Comprobar que la infraestructura existe
        id: infra
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          faltan=()

          if ! gcloud artifacts repositories describe '${{ vars.ARTIFACT_REPO }}' \
                 --location "$REGION" --project '${{ vars.GCP_PROJECT_ID }}' >/dev/null 2>&1; then
            faltan+=("el repositorio de Artifact Registry \`${{ vars.ARTIFACT_REPO }}\` en $REGION")
          fi

          if ! gcloud container clusters describe '${{ vars.GKE_CLUSTER }}' \
                 --zone '${{ vars.GKE_ZONE }}' --project '${{ vars.GCP_PROJECT_ID }}' >/dev/null 2>&1; then
            faltan+=("el cluster de GKE \`${{ vars.GKE_CLUSTER }}\` en ${{ vars.GKE_ZONE }}")
          fi

          if [ ${#faltan[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Infraestructura presente: registry y cluster."
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Sin infraestructura: no hay donde desplegar"
            echo ""
            echo "Los jobs de construccion y despliegue se omiten. **No es un fallo"
            echo "de este commit**: las credenciales estan bien y el codigo paso CI."
            echo ""
            echo "No existe:"
            echo ""
            printf -- '- %s\n' "${faltan[@]}"
            echo ""
            echo "La infraestructura de este proyecto se enciende y se apaga a proposito,"
            echo "porque cuesta del orden de 0.50 USD/hora. Para levantarla:"
            echo ""
            echo '```bash'
            echo "pnpm cloud:up      # bootstrap, terraform apply, imagenes y despliegue"
            echo "pnpm cloud:cost    # que hay encendido ahora mismo"
            echo '```'
            echo ""
            echo "El procedimiento completo esta en \`docs/operations/CLOUD.md\` (5.2)."
            echo ""
            echo "> Recuerda que §8.1 del enunciado exige el sistema desplegado y"
            echo "> accesible en la nube **el dia de la calificacion**."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Sin infraestructura en GCP. Construccion y despliegue omitidos; corre 'pnpm cloud:up'."

  # ===========================================================================
  # Que componentes cambio este merge. Workflow reutilizable (`changes.yml`):
  # la lista de rutas por componente es la definicion de la estrategia de
  # monorepo y tenerla dos veces es como se llega a que un servicio se
  # despliegue desde un workflow y no desde el otro.
  # ===========================================================================
  changes:
    name: 'Componentes modificados'
    needs: preflight
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/changes.yml

  # ===========================================================================
  # Construccion selectiva: una imagen por componente MODIFICADO, en paralelo.
  #
  # Con la matriz sobre `needs.changes`, un cambio en `payment-service`
  # construye una imagen en vez de siete; y cuando una falla, el nombre del job
  # dice cual sin tener que leer el log entero.
  # ===========================================================================
  build-development:
    name: 'Construir ${{ matrix.component }}'
    needs: [preflight, changes]
    if: >-
      github.ref == 'refs/heads/develop' && needs.changes.outputs.any == 'true' &&
      needs.preflight.outputs.infra_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Calcular registry, etiqueta y Dockerfile
        id: meta
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}"
          COMPONENT='${{ matrix.component }}'

          case "$COMPONENT" in
            gateway) DOCKERFILE='apps/gateway/Dockerfile' ;;
            web)     DOCKERFILE='apps/web/Dockerfile' ;;
            *)       DOCKERFILE="apps/services/${COMPONENT}/Dockerfile" ;;
          esac

          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

          echo "image=${REGISTRY}/${COMPONENT}:${DEV_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `cache-from`/`cache-to` con alcance por componente: cada imagen reusa
      # sus propias capas y no invalida las de las otras seis.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.DEV_IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # ===========================================================================
  # Despliegue al entorno de desarrollo (merge a develop -> namespace `dev`).
  #
  # Las imagenes de los componentes que NO cambiaron ya estan en el registry de
  # corridas anteriores; el chart recibe la etiqueta nueva solo para los que se
  # acaban de construir, y conserva la que tuviera cada uno de los demas
  # (`UPDATED_COMPONENTS` en helm-deploy.sh). Eso es lo que hace selectivo al
  # despliegue y no solo a la construccion.
  # ===========================================================================
  deploy-development:
    name: 'Despliegue Continuo a Desarrollo (dev)'
    needs: [preflight, changes, build-development]
    if: >-
      github.ref == 'refs/heads/develop' && needs.changes.outputs.any == 'true' &&
      needs.preflight.outputs.infra_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obtener credenciales del cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Desplegar en Kubernetes (namespace dev)
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          IMAGE_REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}" \
            bash .github/scripts/helm-deploy.sh
        env:
          NAMESPACE: dev
          RELEASE_NAME: bank-usac-dev
          IMAGE_TAG: ${{ env.DEV_IMAGE_TAG }}
          # Broker propio del namespace. Redundante — los secrets del
          # despliegue ya traen `rabbitmq.inCluster=true` para los dos
          # entornos — pero deja escrito en el workflow lo que hoy solo se
          # sabe leyendo un secreto.
          IN_CLUSTER_BROKER: 'true'
          # Bases propias sobre las mismas VMs. Se queda vacio hasta que las
          # cinco bases `<nombre>_dev` existan; entonces basta con definir la
          # variable DEV_DATABASE_SUFFIX del repositorio como `_dev`.
          DATABASE_SUFFIX: ${{ vars.DEV_DATABASE_SUFFIX }}
          # Que helm diga por que recurso espera. Tres despliegues seguidos
          # caducaron con los ocho Deployments del release en 1/1 Running, y
          # sin esto el log no dice a quien esperaba.
          HELM_WAIT_DEBUG: 'true'
          UPDATED_COMPONENTS: ${{ join(fromJSON(needs.changes.outputs.components), ' ') }}
          HELM_SECRETS: ${{ secrets.HELM_SECRETS }}
          # El token del webhook de alertas, de UNA fuente (T-60, A3): el mismo
          # secreto que el job `deploy-observability` pone en el Secret de
          # Grafana. `helm-deploy.sh` lo pasa despues de HELM_SECRETS, asi que
          # gana sobre una linea vieja que siguiera ahi.
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          INFRA_ADDRESSES: ${{ secrets.INFRA_ADDRESSES }}
          GATEWAY_PUBLIC_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
          # El Collector de T-49, en su nombre DNS dentro del cluster. La
          # variable de repositorio solo hace falta para apuntar a otro sitio:
          # el valor por defecto es el que instala el job
          # `deploy-observability`, para que nadie tenga que acordarse de
          # ponerlo. Vacio, los pods registran trazas y metricas y no las
          # exportan (T-48) — que es codigo instrumentado que no se ve, y §8.3
          # lo cobra al 50 %.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT || 'http://otel-gateway.observability.svc.cluster.local:4318' }}
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Despliegue a \`dev\`"
            echo ""
            echo "${{ needs.changes.outputs.reason }}"
            echo ""
            echo "Componentes actualizados: \`${{ join(fromJSON(needs.changes.outputs.components), '`, `') }}\`"
            echo ""
            echo "Los demas conservan la etiqueta que ya tenian en el release."
          } >> "$GITHUB_STEP_SUMMARY"






  # ===========================================================================
  # Retirada del entorno de desarrollo, a mano y solo si hace falta.
  #
  # `dev` se retiro una vez porque el cluster corria UN nodo y tres copias de la
  # aplicacion no cabian: el nodo llego al 99% de CPU *reservada* usando el 11%
  # real, y produccion se quedo con siete pods en `FailedScheduling:
  # Insufficient cpu`. Con el pool en los tres nodos que declara
  # `infra/terraform/gcp/variables.tf` vuelve a caber, y el despliegue a `dev`
  # de arriba esta activo otra vez.
  #
  # Este job se queda como la valvula de escape: libera los 450m que `dev`
  # reserva, desde Actions > CD > Run workflow marcando `retire_dev`, sin que
  # nadie necesite acceso a gcloud.
  #
  # Es idempotente — `helm uninstall` de un release que no existe no es un
  # error — asi que volver a lanzarlo no rompe nada.
  # ===========================================================================
  retire-development:
    name: 'Retirar el entorno de desarrollo (dev)'
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.retire_dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obtener credenciales del cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Retirar el release de desarrollo
        run: |
          set -euo pipefail

          echo "=== CPU reservada ANTES ==="
          kubectl describe nodes | grep -A6 "Allocated resources" || true

          if helm status bank-usac-dev --namespace dev >/dev/null 2>&1; then
            helm uninstall bank-usac-dev --namespace dev --wait --timeout 10m
            echo "Release bank-usac-dev retirado."
          else
            echo "No hay release bank-usac-dev en el namespace dev; nada que retirar."
          fi

          kubectl delete namespace dev --ignore-not-found --wait --timeout=5m

          echo "=== CPU reservada DESPUES ==="
          kubectl describe nodes | grep -A6 "Allocated resources" || true


  deploy-production:
    name: 'Despliegue Continuo a Produccion (Rolling Update)'
    needs: preflight
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.preflight.outputs.infra_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determinar la version publicada a desplegar
        id: version
        run: |
          set -euo pipefail
          # La ultima version formal que release.yml publico. Sin tag no hay
          # nada que desplegar: produccion no improvisa una imagen.
          VERSION="$(git tag -l 'v*' --sort=-v:refname | sed -n 1p)"

          if [ -z "$VERSION" ]; then
            echo "::error::No hay ningun tag vX.X.X. Produccion solo despliega imagenes publicadas por release.yml."
            exit 1
          fi

          # Y que el tag CONTENGA lo que se esta desplegando.
          #
          # Sin esto, el paso anterior es una trampa silenciosa: elige el tag
          # mas alto del repositorio, no el de este commit. Un merge a `main`
          # sin tagear despliega la version anterior, el rollout llega a Ready,
          # el resumen sale verde — y produccion corre codigo viejo. Medido el
          # 2026-10-16: `main` estaba 113 commits por delante de `v1.2.2`, asi
          # que el primer despliegue de la Fase 3 habria puesto en pie la Fase 2.
          #
          # La comprobacion es al reves de lo que uno escribe primero. No es
          # "¿el tag es ancestro del commit?" —`v1.2.2` lo era, y por eso un
          # `--is-ancestor` normal no lo atrapa— sino "¿el commit esta CONTENIDO
          # en el tag?". Si no lo esta, las imagenes de ese tag no llevan este
          # codigo dentro.
          if ! git merge-base --is-ancestor HEAD "$VERSION"; then
            DETRAS="$(git rev-list --count "$VERSION"..HEAD)"
            echo "::error::El tag mas reciente ($VERSION) NO contiene el commit que se intenta desplegar: HEAD va $DETRAS commit(s) por delante. Las imagenes de $VERSION no llevan este codigo. Crea y empuja un tag nuevo (git tag -a vX.Y.Z -m '...' && git push origin vX.Y.Z), espera a que release.yml publique las siete imagenes, y vuelve a lanzar este despliegue."
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Desplegando la version publicada $VERSION, que contiene $GITHUB_SHA"

      # Dos caminos de autenticacion, y el primero es el preferido.
      #
      # Workload Identity Federation intercambia el token OIDC que GitHub emite
      # para esta corrida por credenciales de GCP de corta vida. No hay ninguna
      # llave que guardar, rotar ni filtrar — y es el unico camino disponible
      # cuando la organizacion aplica `constraints/iam.disableServiceAccountKeyCreation`,
      # que prohibe descargar llaves JSON. Necesita `id-token: write`, arriba.
      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # El camino con llave, para un proyecto sin esa restriccion.
      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obtener credenciales del cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Rolling update en produccion
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          IMAGE_REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}" \
            bash .github/scripts/helm-deploy.sh
        env:
          NAMESPACE: prod
          RELEASE_NAME: bank-usac
          IMAGE_TAG: ${{ steps.version.outputs.value }}
          HELM_SECRETS: ${{ secrets.HELM_SECRETS }}
          # El token del webhook de alertas, de UNA fuente (T-60, A3): el mismo
          # secreto que el job `deploy-observability` pone en el Secret de
          # Grafana. `helm-deploy.sh` lo pasa despues de HELM_SECRETS, asi que
          # gana sobre una linea vieja que siguiera ahi.
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          INFRA_ADDRESSES: ${{ secrets.INFRA_ADDRESSES }}
          GATEWAY_PUBLIC_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
          # La IP reservada en Terraform (`terraform output -raw
          # gateway_public_ip`). Solo produccion la fija: es la direccion que
          # lleva escrita el acuerdo de integracion con el banco pareja, y
          # tiene que sobrevivir a que se borre el Service o se reinstale el
          # release (TD-080). `dev` usa una efimera a proposito.
          GATEWAY_STATIC_IP: ${{ vars.GATEWAY_STATIC_IP }}
          # El Collector de T-49, en su nombre DNS dentro del cluster. La
          # variable de repositorio solo hace falta para apuntar a otro sitio:
          # el valor por defecto es el que instala el job
          # `deploy-observability`, para que nadie tenga que acordarse de
          # ponerlo. Vacio, los pods registran trazas y metricas y no las
          # exportan (T-48) — que es codigo instrumentado que no se ve, y §8.3
          # lo cobra al 50 %.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT || 'http://otel-gateway.observability.svc.cluster.local:4318' }}
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
          # El banco pareja (T-60). Mientras no haya uno real, el envio va al
          # mock de este release; con la URL del banco pareja, el mock queda
          # solo para inyectar fallos (enunciado §4.1: los fallos se inyectan
          # con el mock propio, nunca alterando el sistema del otro grupo).
          PARTNER_MOCK_ENABLED: ${{ vars.PARTNER_MOCK_ENABLED || 'true' }}
          # El correo real de activacion (Resend). `simulated` si no se define:
          # registra el envio sin mandar nada. Con `resend` hacen falta el
          # secreto RESEND_API_KEY y la variable EMAIL_FROM; el enlace apunta al
          # frontend publico (WEB_PUBLIC_URL). Solo produccion: el frontend de
          # dev no es publico, asi que un enlace a el no sirve de nada.
          NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL || 'simulated' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_BASE_URL: ${{ vars.WEB_PUBLIC_URL }}
          INTERBANK_PARTNER_BASE_URL: ${{ vars.INTERBANK_PARTNER_BASE_URL }}
          # Los otros dos datos del banco pareja: su codigo y la clave que le
          # enviamos. Sin ellos se conserva el mock (BANK99) y lo de HELM_SECRETS.
          INTERBANK_PARTNER_BANK_CODE: ${{ vars.INTERBANK_PARTNER_BANK_CODE }}
          INTERBANK_API_KEY_OUTBOUND: ${{ secrets.INTERBANK_API_KEY_OUTBOUND }}
          # Mide la disponibilidad mientras el rolling update ocurre. El chart
          # declara `maxUnavailable: 0`; esto es lo que lo demuestra.
          ZERO_DOWNTIME_PROBE_URL: ${{ vars.GATEWAY_PUBLIC_URL }}/health

      # -----------------------------------------------------------------------
      # El frontend que la gente abre de verdad.
      #
      # `infra/terraform/gcp/cloud_run.tf` declara el Cloud Run `bank-usac-web`
      # con `image = var.web_image`: una variable que se fija en el
      # `terraform apply` y que NADIE vuelve a tocar. El paso de arriba
      # actualiza el Deployment `web` de GKE, que es un Service ClusterIP y por
      # tanto no lo alcanza ningun navegador. Resultado hasta hoy: cada release
      # daba verde y el portal publico seguia sirviendo la imagen del dia del
      # `apply`.
      #
      # Se usa `services update --image` y no `run deploy` a proposito: update
      # solo pide `run.services.update`, mientras que `deploy` ademas exige
      # `iam.serviceAccounts.actAs` sobre la cuenta de ejecucion del servicio.
      # Menos permiso para el mismo efecto, y conserva el puerto, las variables
      # de entorno y el escalado tal y como Terraform los dejo.
      #
      # Se activa definiendo la variable de repositorio CLOUD_RUN_SERVICE con el
      # nombre del servicio (`bank-usac-web`). Sin ella el paso no corre y el
      # comportamiento es exactamente el de antes.
      - name: Actualizar el frontend publico (Cloud Run)
        if: vars.CLOUD_RUN_SERVICE != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          REGION="$(echo '${{ vars.GKE_ZONE }}' | sed 's/-[a-z]$//')"
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/web:${VERSION}"

          echo "Apuntando ${SERVICE} a ${IMAGE}"

          if ! gcloud run services update "$SERVICE" \
                 --region "$REGION" \
                 --image "$IMAGE" \
                 --quiet 2>/tmp/run-update.err; then
            cat /tmp/run-update.err

            # El unico fallo que no se arregla reintentando: falta el rol.
            if grep -qiE 'permission|denied|403' /tmp/run-update.err; then
              {
                echo "## El frontend publico NO se actualizo"
                echo ""
                echo "La cuenta de servicio del pipeline no puede escribir en Cloud Run."
                echo "Hace falta concederle \`roles/run.developer\` sobre el servicio"
                echo "\`${SERVICE}\` — Kubernetes si quedo en \`${VERSION}\`."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Falta roles/run.developer para actualizar Cloud Run. Kubernetes quedo en ${VERSION}; el portal publico no."
            fi

            exit 1
          fi

          # La comprobacion va aqui dentro y no en un job aparte: un despliegue
          # que nadie comprueba es exactamente lo que produjo este defecto.
          SIRVIENDO="$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(spec.template.spec.containers[0].image)')"

          if [ "$SIRVIENDO" != "$IMAGE" ]; then
            echo "::error::Cloud Run quedo sirviendo ${SIRVIENDO}, no ${IMAGE}."
            exit 1
          fi

          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.url)')"
          CODIGO="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/" || echo 000)"

          {
            echo "### Frontend publico"
            echo ""
            echo "- Servicio: \`${SERVICE}\`"
            echo "- Imagen: \`${IMAGE}\`"
            echo "- URL: ${URL} (HTTP ${CODIGO})"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$CODIGO" = "200" ] || echo "::warning::El portal respondio ${CODIGO} tras la actualizacion."

      # §4.1, Dashboards obligatorios: «Despliegues marcados como anotaciones».
      #
      # Hay DOS fuentes de anotacion, y no se pisan:
      #
      #   Despliegues (rollout) — los dibuja cada dashboard con una consulta
      #     sobre `kube_replicaset_created`: un ReplicaSet nuevo solo nace cuando
      #     cambia la plantilla del pod, asi que marca rollouts y no escalados
      #     del HPA. Hasta T-60 era `kube_deployment_metadata_generation`, que
      #     sube tambien con cada escalado (el subrecurso `scale` cambia
      #     `spec.replicas`) y llenaba la prueba de carga de falsos despliegues.
      #   Releases (esta) — la version que se desplego, con su enlace a la
      #     corrida. La consulta no puede saber eso: la etiqueta de la imagen no
      #     esta en ninguna metrica de Kubernetes.
      #
      # DESDE DENTRO DEL CLUSTER (T-60). Antes esto hacia
      # `POST ${GRAFANA_URL}/api/annotations` desde el runner, y Grafana es
      # ClusterIP a proposito (no hay IP publica libre en la cuota): la
      # peticion no podia llegar nunca. Ahora el runner abre un `port-forward`
      # al Service de Grafana — pasa por el API server, con las credenciales de
      # GKE que el job ya tiene — y se autentica como `admin` con el secreto
      # GRAFANA_ADMIN_PASSWORD que el pipeline ya usa. Sin token aparte, y sin
      # un pod con la contrasena en sus argumentos.
      #
      # NO es fatal: una anotacion que falta no justifica tumbar un despliegue
      # que ya ocurrio. Sin stack de observabilidad o sin la contrasena, se
      # omite con su motivo en el resumen.
      - name: 'Anotar la release en Grafana'
        if: success()
        continue-on-error: true
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          omitir() {
            {
              echo "### Anotacion de release: omitida"
              echo ""
              echo "$1"
              echo "Los dashboards siguen marcando los despliegues por consulta;"
              echo "lo que falta es la etiqueta de version sobre la linea."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Anotacion de release omitida: $1"
            exit 0
          }
          [ -n "${GRAFANA_ADMIN_PASSWORD:-}" ] || omitir "Falta el secreto GRAFANA_ADMIN_PASSWORD."
          kubectl get svc grafana -n observability >/dev/null 2>&1 \
            || omitir "No hay Service grafana en el namespace observability (el stack no esta desplegado)."

          kubectl port-forward -n observability svc/grafana 13000:80 >/tmp/pf-grafana.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:13000/api/health && break
            sleep 1
          done

          AHORA="$(date +%s)000"
          CUERPO="$(jq -n --argjson t "$AHORA" --arg v "$VERSION" --arg u "$RUN_URL" \
            '{time: $t, tags: ["release", "prod", $v],
              text: ("Release <b>" + $v + "</b> en prod · <a href=\"" + $u + "\">corrida</a>")}')"
          CODIGO="$(curl -s -o /tmp/anotacion.json -w '%{http_code}' --max-time 15 \
            -u "admin:${GRAFANA_ADMIN_PASSWORD}" \
            -X POST http://127.0.0.1:13000/api/annotations \
            -H 'Content-Type: application/json' -d "$CUERPO")"

          if [ "$CODIGO" = "200" ]; then
            echo "Anotacion de release ${VERSION} creada en Grafana."
            echo "- Anotacion de release \`${VERSION}\` creada en Grafana." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Grafana respondio ${CODIGO} al anotar la release."
            cat /tmp/anotacion.json /tmp/pf-grafana.log 2>/dev/null || true
          fi

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Produccion actualizada a \`${{ steps.version.outputs.value }}\`"
            echo ""
            echo "Rolling update completado en el namespace \`prod\`, con las imagenes"
            echo "publicadas por \`release.yml\`. Ninguna imagen fue construida aqui."
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # El stack de observabilidad (T-49).
  #
  # Se despliega SOLO desde `main`, y no desde `develop`, aunque el resto del
  # CD si distinga los dos entornos. El motivo es que este release es UNO para
  # los dos: `dev` y `prod` mandan su telemetria al mismo Collector y se miran
  # en el mismo Grafana, separados por el atributo `deployment.environment`
  # (T-48). Si `develop` pudiera actualizarlo, un commit de desarrollo
  # cambiaria el monitoreo de produccion — la misma clase de problema que
  # TD-070, pero esta si se puede evitar sin coste.
  #
  # Para iterar sobre el stack sin merge: Actions > CD > Run workflow >
  # deploy_observability.
  #
  # Los .tgz de los subcharts estan versionados en `charts/` y `Chart.lock`
  # fija su digest, asi que el despliegue NO depende de que los repositorios de
  # Grafana, Prometheus y OpenTelemetry respondan. El dia de la calificacion eso
  # importa. Por eso aqui no se ejecuta ningun `helm dependency build`: ese
  # comando refresca el indice por red y devolveria la dependencia que se quiso
  # quitar.
  # ===========================================================================
  deploy-observability:
    name: 'Stack de observabilidad (Collector, Prometheus, Tempo, Loki, Grafana)'
    needs: preflight
    if: >-
      needs.preflight.outputs.infra_ready == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_observability))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHART: infra/k8s/helm/bank-observability
      RELEASE: bank-observability
      NAMESPACE: observability
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Autenticar contra Google Cloud (Workload Identity Federation)'
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 'Autenticar contra Google Cloud (llave de cuenta de servicio)'
        if: vars.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obtener credenciales del cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Comprobar los secretos del stack
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GRAFANA_ADMIN_PASSWORD}" ]; then
            echo "::error::Falta el secret GRAFANA_ADMIN_PASSWORD. Sin el, Grafana quedaria con la contrasena por defecto del chart, que es publica."
            exit 1
          fi
          if [ "${#GRAFANA_ADMIN_PASSWORD}" -lt 16 ]; then
            echo "::error::GRAFANA_ADMIN_PASSWORD tiene ${#GRAFANA_ADMIN_PASSWORD} caracteres. Minimo 16: es la consola que ve todo el sistema."
            exit 1
          fi
          # El token del webhook de alertas (T-60, A3). Era el UNICO paso manual
          # del stack: `docs/operations/CLOUD.md` pedia crear el Secret a mano, y
          # como Grafana lo lee con `optional: true` su ausencia no fallaba nada
          # — el Gateway respondia 401 y las alertas no llegaban a la bitacora.
          # Ahora falta el secreto de GitHub y el job falla diciendolo.
          if [ -z "${ALERT_WEBHOOK_TOKEN}" ]; then
            echo "::error::Falta el secret ALERT_WEBHOOK_TOKEN (32 caracteres o mas, p. ej. 'openssl rand -hex 32'). Es el secreto que Grafana manda al webhook POST /api/alerts/slo del Gateway; el mismo valor llega a los Gateway de dev y prod por helm-deploy.sh. Sin el, las alertas se ven en Grafana y no llegan a Notification & Audit."
            exit 1
          fi
          if [ "${#ALERT_WEBHOOK_TOKEN}" -lt 32 ]; then
            echo "::error::ALERT_WEBHOOK_TOKEN tiene ${#ALERT_WEBHOOK_TOKEN} caracteres. El Gateway exige al menos 32 y no arrancaria con el."
            exit 1
          fi

      - name: Crear el namespace y los Secrets de Grafana
        id: secrets
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Idempotente a proposito: `create secret` fallaria en el segundo
          # despliegue, y `apply` sobre la salida de un `--dry-run` actualiza la
          # contrasena si cambio.
          kubectl create secret generic grafana-admin \
            --namespace "$NAMESPACE" \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          # El que antes se creaba a mano (T-60, A3). Mismo patron idempotente.
          kubectl create secret generic grafana-alert-webhook \
            --namespace "$NAMESPACE" \
            --from-literal=token="$ALERT_WEBHOOK_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Grafana lee el token como variable de entorno AL ARRANCAR. Un Secret
          # que cambia no reinicia el pod, y entonces Grafana seguiria mandando
          # el token viejo mientras el Gateway ya espera el nuevo: 401 en
          # silencio. El hash va como anotacion del pod (ver «Desplegar el
          # stack»), y un hash distinto es un pod nuevo — la misma solucion que
          # TD-089 dio a los Secrets del banco. Es el hash, nunca el valor.
          echo "token_hash=$(printf '%s' "$ALERT_WEBHOOK_TOKEN" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Las NetworkPolicy del stack (T-54), sin el `helm upgrade` a mano que
      # pedia `docs/operations/CLOUD.md` §5.4 (T-60, A3).
      #
      # Se encienden con la variable de repositorio OBS_NETWORK_POLICIES=true o
      # con el input `network_policies` de una corrida manual. Una variable y no
      # sólo un input porque el `helm upgrade` de abajo no usa `--reuse-values`:
      # una politica encendida a mano se apagaba en el siguiente merge a main
      # sin que nadie lo decidiera.
      #
      # Dos guardas, porque Kubernetes acepta una NetworkPolicy aunque nadie la
      # aplique:
      #   - sin Dataplane V2 (`ADVANCED_DATAPATH`) no se encienden: serian
      #     decorativas, y lo honesto es decirlo en el resumen;
      #   - `apiServerCidr` se acota a la IP real del maestro (/32). Un valor
      #     equivocado deja a Grafana SIN DASHBOARDS y sin error, asi que la
      #     comprobacion de despues cuenta los dashboards y, si faltan, apaga
      #     las politicas y falla.
      - name: Decidir las NetworkPolicy
        id: netpol
        env:
          QUIERE: ${{ (github.event_name == 'workflow_dispatch' && inputs.network_policies) || vars.OBS_NETWORK_POLICIES == 'true' }}
        run: |
          set -euo pipefail
          if [ "$QUIERE" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NetworkPolicy: apagadas (OBS_NETWORK_POLICIES no es 'true')."
            exit 0
          fi
          DATAPATH="$(gcloud container clusters describe "${{ vars.GKE_CLUSTER }}" \
            --location "${{ vars.GKE_ZONE }}" --format='value(networkConfig.datapathProvider)')"
          ENDPOINT="$(gcloud container clusters describe "${{ vars.GKE_CLUSTER }}" \
            --location "${{ vars.GKE_ZONE }}" --format='value(endpoint)')"
          if [ "$DATAPATH" != "ADVANCED_DATAPATH" ]; then
            echo "::warning::Se pidieron NetworkPolicy pero el cluster tiene datapath '${DATAPATH:-legacy}', no ADVANCED_DATAPATH: nadie las aplicaria. Quedan apagadas."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "api_cidr=${ENDPOINT}/32" >> "$GITHUB_OUTPUT"
          echo "NetworkPolicy: encendidas, API server en ${ENDPOINT}/32."

      - name: Desplegar el stack
        env:
          TOKEN_HASH: ${{ steps.secrets.outputs.token_hash }}
          NETPOL: ${{ steps.netpol.outputs.enabled }}
          API_CIDR: ${{ steps.netpol.outputs.api_cidr }}
        run: |
          set -euo pipefail
          # Los subcharts van versionados en `charts/`, asi que no hay
          # `helm dependency build`: el despliegue no toca la red mas que para
          # bajar las imagenes. Lo que se comprueba es que lo versionado sea lo
          # declarado.
          ./infra/k8s/scripts/check-chart-deps.sh "$CHART"

          helm upgrade "$RELEASE" "$CHART" \
            --install \
            --namespace "$NAMESPACE" \
            --set-string "grafana.podAnnotations.bank-usac/alert-webhook-token-hash=${TOKEN_HASH}" \
            --set "networkPolicies.enabled=${NETPOL:-false}" \
            ${API_CIDR:+--set-string "networkPolicies.apiServerCidr=${API_CIDR}"} \
            --wait \
            --timeout 20m

      - name: Comprobar que el stack responde
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          NETPOL: ${{ steps.netpol.outputs.enabled }}
        run: |
          set -euo pipefail
          kubectl get pods,pvc -n "$NAMESPACE"

          # Lo que de verdad hay que comprobar no es que los pods arranquen,
          # sino que Prometheus este raspando al Collector: ese objetivo es el
          # unico camino por el que las metricas de las aplicaciones llegan a
          # un dashboard. Un stack verde con ese objetivo caido no mide nada.
          for deployment in otel-gateway prometheus-server grafana; do
            kubectl rollout status "deployment/$deployment" -n "$NAMESPACE" --timeout 5m
          done
          kubectl rollout status daemonset/otel-log-agent -n "$NAMESPACE" --timeout 5m
          kubectl rollout status statefulset/loki -n "$NAMESPACE" --timeout 5m
          kubectl rollout status statefulset/tempo -n "$NAMESPACE" --timeout 5m

          objetivos="$(kubectl run otel-check --rm -i --restart=Never -n "$NAMESPACE" \
            --image=curlimages/curl:8.11.1 --quiet -- \
            curl -s --max-time 20 'http://prometheus-server/api/v1/targets?state=active' || true)"

          if grep -q '"job":"otel-gateway"' <<<"$objetivos"; then
            echo "Prometheus esta raspando el Collector."
          else
            echo "::warning::Prometheus todavia no lista el objetivo otel-gateway. Puede tardar un intervalo de raspado (30 s)."
          fi

          # Grafana, por su API, desde el runner y a traves del API server:
          # Grafana es ClusterIP y no tiene otra entrada.
          kubectl port-forward -n "$NAMESPACE" svc/grafana 13000:80 >/tmp/pf-grafana.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:13000/api/health && break
            sleep 2
          done
          g() { curl -s --max-time 15 -u "admin:${GRAFANA_ADMIN_PASSWORD}" "http://127.0.0.1:13000$1"; }

          # Los nueve dashboards. Si faltan con las NetworkPolicy encendidas, la
          # causa casi segura es `apiServerCidr`: el sidecar ya no alcanza el
          # API server y Grafana arranca vacio SIN un error. Se vuelve al
          # estado anterior antes de fallar, que es el camino de vuelta de
          # CLOUD.md §5.4 sin la persona.
          ESPERADOS="$(find "$CHART/dashboards" -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          CARGADOS=0
          for _ in $(seq 1 12); do
            CARGADOS="$(g '/api/search?type=dash-db' | jq 'length' 2>/dev/null || echo 0)"
            [ "$CARGADOS" -ge "$ESPERADOS" ] && break
            sleep 10
          done
          if [ "$CARGADOS" -lt "$ESPERADOS" ]; then
            if [ "$NETPOL" = "true" ]; then
              echo "::error::Grafana tiene ${CARGADOS} de ${ESPERADOS} dashboards con las NetworkPolicy encendidas. Se apagan (helm upgrade --reuse-values --set networkPolicies.enabled=false) y el job falla: revisar apiServerCidr."
              helm upgrade "$RELEASE" "$CHART" --namespace "$NAMESPACE" --reuse-values \
                --set networkPolicies.enabled=false --wait --timeout 10m || true
            else
              echo "::error::Grafana tiene ${CARGADOS} de ${ESPERADOS} dashboards."
            fi
            exit 1
          fi
          echo "Grafana cargo los ${CARGADOS} dashboards."

          # El contact point del webhook (T-60, A3). Lo aprovisiona el chart, asi
          # que si no esta, Grafana no leyo su configuracion de alertas.
          PUNTOS="$(g '/api/v1/provisioning/contact-points' | jq -r '.[].name' 2>/dev/null || true)"
          for cp in bank-audit-prod bank-audit-dev; do
            if ! grep -qx "$cp" <<<"$PUNTOS"; then
              echo "::error::Grafana no tiene el contact point ${cp}. Las alertas no tendrian a donde ir."
              exit 1
            fi
          done
          echo "Contact points presentes: bank-audit-prod, bank-audit-dev."

      # Que la alerta llegue de verdad a la bitacora (T-60, A3): un POST de
      # prueba al webhook de cada Gateway, con el token del secreto, y que
      # Grafana tenga ESE token y no otro.
      #
      # No es fatal. El stack de observabilidad se despliega en un job aparte
      # del de las aplicaciones, y un Gateway que todavia no existe o esta
      # rodando no es un defecto del stack: es un aviso. Lo que si se distingue
      # es el 401 — token distinto entre Grafana y el Gateway —, que es el fallo
      # silencioso que esto existe para hacer visible.
      #
      # La alerta de prueba va como `resolved` y `info`: queda registrada en
      # Notification & Audit, que es justo la evidencia de que el canal
      # funciona, sin abrir un incidente.
      - name: Probar el webhook de alertas
        continue-on-error: true
        env:
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
        run: |
          set -uo pipefail
          ESPERADO="$(printf '%s' "$ALERT_WEBHOOK_TOKEN" | sha256sum | cut -c1-16)"
          # Comillas simples a proposito: la variable se expande DENTRO del pod.
          # shellcheck disable=SC2016
          EN_GRAFANA="$(kubectl exec -n "$NAMESPACE" deploy/grafana -c grafana -- \
            sh -c 'printf %s "$ALERT_WEBHOOK_TOKEN" | sha256sum' 2>/dev/null | cut -c1-16 || true)"
          if [ "$EN_GRAFANA" = "$ESPERADO" ]; then
            echo "Grafana tiene el token del secreto ALERT_WEBHOOK_TOKEN (se compara el hash)."
          else
            echo "::warning::El token que ve Grafana no coincide con ALERT_WEBHOOK_TOKEN (o no se pudo leer). Las alertas recibirian 401."
          fi

          AHORA="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CUERPO="$(jq -n --arg t "$AHORA" --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{
            status: "resolved",
            alerts: [{
              status: "resolved",
              labels: {alertname: "PipelineWebhookCheck", severity: "info"},
              annotations: {summary: ("Prueba del canal de alertas desde cd.yml: " + $u)},
              startsAt: $t, endsAt: $t, fingerprint: "pipeline-webhook-check"
            }]}')"

          resumen="### Webhook de alertas"$'\n\n'
          for par in "prod bank-usac-gateway" "dev bank-usac-dev-gateway"; do
            read -r ns svc <<< "$par"
            if ! kubectl get svc "$svc" -n "$ns" >/dev/null 2>&1; then
              echo "::warning::No hay Service ${svc} en ${ns} todavia: el webhook de ese entorno no se pudo probar."
              resumen+="- \`${ns}\`: sin Gateway desplegado, no se probo"$'\n'
              continue
            fi
            kubectl port-forward -n "$ns" "svc/$svc" 18080:3000 >/tmp/pf-gw.log 2>&1 &
            PF=$!
            for _ in $(seq 1 15); do
              curl -s -o /dev/null --max-time 2 http://127.0.0.1:18080/health && break
              sleep 1
            done
            CODIGO="$(curl -s -o /tmp/webhook.json -w '%{http_code}' --max-time 15 \
              -X POST http://127.0.0.1:18080/api/alerts/slo \
              -H "Authorization: Bearer ${ALERT_WEBHOOK_TOKEN}" \
              -H 'Content-Type: application/json' -d "$CUERPO")"
            kill $PF 2>/dev/null || true
            wait $PF 2>/dev/null || true
            case "$CODIGO" in
              2??) echo "Webhook de ${ns}: HTTP ${CODIGO}."; resumen+="- \`${ns}\`: HTTP ${CODIGO}, la alerta de prueba llego a la bitacora"$'\n' ;;
              401) echo "::warning::Webhook de ${ns}: 401. El Gateway tiene otro token: ¿se desplego ${ns} despues de definir ALERT_WEBHOOK_TOKEN?"; resumen+="- \`${ns}\`: **401**, token distinto"$'\n' ;;
              *) echo "::warning::Webhook de ${ns}: HTTP ${CODIGO}."; cat /tmp/webhook.json 2>/dev/null || true; resumen+="- \`${ns}\`: HTTP ${CODIGO}"$'\n' ;;
            esac
          done
          printf '%s' "$resumen" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Stack de observabilidad"
            echo ""
            echo "Release \`$RELEASE\` en el namespace \`$NAMESPACE\`."
            echo ""
            echo "Grafana no se expone por un LoadBalancer: queda una sola IP publica"
            echo "libre en la cuota de la region y es el margen de la entrada del banco."
            echo "Se entra con:"
            echo ""
            echo '```'
            echo "kubectl port-forward -n $NAMESPACE svc/grafana 3000:80"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
