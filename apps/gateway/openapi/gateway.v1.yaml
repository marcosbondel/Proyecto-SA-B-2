openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: ""
      summary: "Liveness: responde mientras el proceso viva"
      tags:
        - health
  /ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        "200":
          description: ""
      summary: "Readiness: 503 mientras el broker sea inalcanzable"
      tags:
        - health
  /api/auth/login:
    post:
      description: Publica customer.authenticate.v1 y espera su respuesta. Credenciales inválidas, correo
        no registrado y cuenta sin activar producen el MISMO rechazo 401.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: ""
      summary: Inicia sesión y devuelve un JWT
      tags:
        - auth
      x-bank-publishes: customer.authenticate.v1
      x-bank-awaits:
        - customer.authenticate.replied.v1
  /api/auth/password-reset:
    post:
      description: Publica customer.password-reset.requested.v1 y devuelve 202 SIEMPRE, exista o no la
        dirección. Responder distinto revelaría qué correos están registrados.
      operationId: AuthController_requestPasswordReset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetDto"
      responses:
        "202":
          description: ""
      summary: Solicita un enlace para restablecer la contraseña
      tags:
        - auth
      x-bank-publishes: customer.password-reset.requested.v1
  /api/auth/password-reset/confirm:
    post:
      description: Publica customer.password-reset.confirm.v1 y espera el evento correlacionado hasta
        cinco segundos. Enlace inválido, ya usado y vencido producen el MISMO rechazo.
      operationId: AuthController_confirmPasswordReset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetDto"
      responses:
        "200":
          description: ""
      summary: Restablece la contraseña con el enlace del correo
      tags:
        - auth
      x-bank-publishes: customer.password-reset.confirm.v1
      x-bank-awaits:
        - customer.password-reset.completed.v1
        - customer.password-reset.rejected.v1
  /api/customers/{customerId}/password:
    post:
      description: "Publica customer.change-password.v1 y espera el evento correlacionado. Requiere la
        contraseña actual: la sesión no basta. NADIE puede cambiar la de otra persona,
        administradores incluidos — para eso está la recuperación por correo."
      operationId: CustomersController_changePassword
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordDto"
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Cambia la contraseña de la propia cuenta
      tags:
        - customers
      x-bank-publishes: customer.change-password.v1
      x-bank-awaits:
        - customer.password-changed.v1
        - customer.password-change.rejected.v1
  /api/customers/verify-email:
    get:
      description: Devuelve un veredicto en la misma respuesta, esperando el evento correlacionado hasta
        cinco segundos. El silencio produce 504, nunca un rechazo.
      operationId: CustomersController_verifyEmail
      parameters: []
      responses:
        "200":
          description: ""
      summary: Activa la cuenta desde el enlace del correo
      tags:
        - customers
      x-bank-publishes: customer.verify-email.v1
      x-bank-awaits:
        - customer.email.verified.v1
        - customer.email.verification.rejected.v1
  /api/customers:
    post:
      description: "La imagen se deposita en el almacenamiento de objetos y solo su referencia viaja por
        el broker. Devuelve 202: el registro aún no ocurrió."
      operationId: CustomersController_register
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegisterCustomerDto"
      responses:
        "202":
          description: ""
      summary: Registra un cliente, con la foto del documento
      tags:
        - customers
      x-bank-publishes: customer.register.v1
    get:
      operationId: CustomersController_list
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Lista de clientes registrados
      tags:
        - customers
      x-bank-publishes: customer.list.query.v1
      x-bank-awaits:
        - customer.list.replied.v1
  /api/customers/{customerId}:
    patch:
      description: El parámetro es el SUJETO; el actor sale del token. Si el actor puede operar sobre ese
        sujeto lo decide Customer Service, no el Gateway.
      operationId: CustomersController_update
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerDto"
      responses:
        "202":
          description: ""
      security:
        - session: []
      summary: Actualiza los datos de un cliente
      tags:
        - customers
      x-bank-publishes: customer.update.v1
    get:
      operationId: CustomersController_get
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta un cliente por id
      tags:
        - customers
      x-bank-publishes: customer.get.query.v1
      x-bank-awaits:
        - customer.get.replied.v1
  /api/customers/pending-validation:
    get:
      operationId: CustomersController_pendingValidation
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Clientes pendientes de validación de identidad
      tags:
        - customers
      x-bank-publishes: customer.pending-validation.query.v1
      x-bank-awaits:
        - customer.pending-validation.replied.v1
  /api/customers/{customerId}/identity-verdict:
    post:
      operationId: CustomersController_setIdentityVerdict
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetIdentityVerdictDto"
      responses:
        "202":
          description: ""
      security:
        - session: []
      summary: Veredicto de identidad del cajero
      tags:
        - customers
      x-bank-publishes: customer.set-identity-verdict.v1
  /api/customers/{customerId}/kyc-status:
    post:
      description: "Publica customer.set-kyc-status.v1. VERIFIED es terminal: un segundo veredicto sobre
        un cliente ya verificado no hace nada."
      operationId: CustomersController_setKycStatus
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetKycStatusDto"
      responses:
        "202":
          description: ""
      security:
        - session: []
      summary: Veredicto KYC del cajero
      tags:
        - customers
      x-bank-publishes: customer.set-kyc-status.v1
  /api/customers/{customerId}/identity-document:
    get:
      description: Devuelve la imagen tal como la tiene guardada Customer Service, con su tipo de
        contenido. El Gateway no decide nada sobre la imagen; solo la sirve.
      operationId: CustomersController_identityDocument
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Foto del documento de identidad de un cliente
      tags:
        - customers
      x-bank-publishes: customer.identity-document.query.v1
      x-bank-awaits:
        - customer.identity-document.replied.v1
  /api/accounts/billers:
    get:
      description: El catálogo de prestadores y la cuenta recaudadora de cada uno. Un pago de servicio es
        una transferencia a esa cuenta, así que no hay un tipo de movimiento aparte.
      operationId: AccountsController_billers
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Lista los servicios que se pueden pagar
      tags:
        - accounts
      x-bank-publishes: account.billers.query.v1
      x-bank-awaits:
        - account.billers.replied.v1
  /api/accounts/{accountId}/deposit:
    post:
      description: "Solo CAJERO_RECEPTOR o ADMINISTRADOR. Devuelve 200 con el saldo resultante: es la
        única ruta de dinero que responde de forma síncrona, porque no hay Saga que esperar. Un
        depósito en una cuenta inactiva la reactiva (A-3) en lugar de ser rechazado."
      operationId: AccountsController_deposit
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositDto"
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Registra un depósito en ventanilla
      tags:
        - accounts
      x-bank-publishes: account.deposit.v1
      x-bank-awaits:
        - account.deposited.v1
        - account.deposit.rejected.v1
  /api/accounts:
    post:
      description: Devuelve 202 y un accountId. La cuenta todavía no existe.
      operationId: AccountsController_open
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountDto"
      responses:
        "202":
          description: ""
      security:
        - session: []
      summary: Abre una cuenta
      tags:
        - accounts
      x-bank-publishes: account.create.v1
    get:
      description: 'Los filtros son una petición, no un permiso: Account Service los cruza con D-06. Una
        lista vacía significa lo mismo que "no hay nada que puedas ver".'
      operationId: AccountsController_list
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Lista cuentas
      tags:
        - accounts
      x-bank-publishes: account.list.query.v1
      x-bank-awaits:
        - account.list.replied.v1
  /api/accounts/{accountId}/balance:
    get:
      description: Espera la respuesta hasta cinco segundos; el silencio produce 504.
      operationId: AccountsController_balance
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta el saldo de una cuenta
      tags:
        - accounts
      x-bank-publishes: account.balance.query.v1
      x-bank-awaits:
        - account.balance.replied.v1
  /api/accounts/{accountId}/operations:
    get:
      description: Espera la respuesta hasta cinco segundos; el silencio produce 504.
      operationId: AccountsController_operations
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta los movimientos de una cuenta
      tags:
        - accounts
      x-bank-publishes: account.operations.query.v1
      x-bank-awaits:
        - account.operations.replied.v1
  /api/accounts/{accountId}/status:
    post:
      description: "ADMINISTRADOR, CAJERO_RECEPTOR y CLIENTE (para sus propias cuentas). Devuelve 202: el
        cambio todavía no ocurrió. El motivo es obligatorio porque es el único registro de por qué
        se hizo."
      operationId: AccountsController_setStatus
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAccountStatusDto"
      responses:
        "202":
          description: ""
      security:
        - session: []
      summary: Activa o desactiva una cuenta
      tags:
        - accounts
      x-bank-publishes: account.set-status.v1
  /api/transfers:
    get:
      description: "Los filtros son una PETICIÓN, no un permiso: Transaction Service los cruza con el
        alcance que deriva de la identidad del sobre. Un CLIENTE que nombre el customerId de otro
        recibe una lista vacía, nunca un 403. phaseStatus (T-28) es un filtro aparte de status:
        nombrar ambos reduce a su intersección. from/to son inclusivos y se aplican sobre la fecha
        de solicitud."
      operationId: TransfersController_list
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Lista transferencias
      tags:
        - transfers
      x-bank-publishes: transaction.list.query.v1
      x-bank-awaits:
        - transaction.list.replied.v1
    post:
      description: "paymentScenario es opcional y solo de demostración: el Gateway lo valida y lo
        traslada, y nunca actúa sobre él."
      operationId: TransfersController_request
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferDto"
      responses:
        "202":
          description: ""
      security:
        - session: []
      summary: Solicita una transferencia e inicia la Saga
      tags:
        - transfers
      x-bank-publishes: transfer.requested.v1
  /api/transfers/{transactionId}:
    get:
      description: Un 504 aquí no significa que la transferencia falló.
      operationId: TransfersController_status
      parameters:
        - name: transactionId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta el estado de una transacción
      tags:
        - transfers
      x-bank-publishes: transaction.status.requested.v1
      x-bank-awaits:
        - transaction.status.replied.v1
  /api/payments:
    get:
      description: "Solo CAJERO_RECEPTOR y ADMINISTRADOR. Payment Service no guarda referencia al cliente,
        así que no puede acotar la lista por dueño: la restricción por rol es lo que hace segura la
        ruta (TD-037). Un CLIENTE ve su pago dentro de la transferencia."
      operationId: PaymentsController_list
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Lista pagos para monitoreo
      tags:
        - payments
      x-bank-publishes: payment.list.query.v1
      x-bank-awaits:
        - payment.list.replied.v1
  /api/payments/simulation:
    get:
      description: Solo ADMINISTRADOR. Devuelve la tasa de fallos, la tasa de timeouts y la latencia
        vigentes, y si vienen del ConfigMap (DEFAULTS) o de un cambio en caliente (RUNTIME).
      operationId: PaymentsController_simulation
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta la simulación del proveedor de pagos
      tags:
        - payments
      x-bank-publishes: payment.simulation.query.v1
      x-bank-awaits:
        - payment.simulation.replied.v1
    put:
      description: 'Solo ADMINISTRADOR. Cuerpo: failureRatePercent, timeoutRatePercent (0–100, su suma no
        puede superar 100) y latencyMs (0–30 000), o bien { "reset": true } para volver a los
        valores del ConfigMap. Aplica solo a pagos cuya transferencia no indicó un scenario.
        Responde con la simulación que quedó vigente.'
      operationId: PaymentsController_updateSimulation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentSimulationDto"
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Cambia en caliente la simulación del proveedor de pagos
      tags:
        - payments
      x-bank-publishes: payment.simulation.update.v1
      x-bank-awaits:
        - payment.simulation.replied.v1
  /api/payments/{paymentId}:
    get:
      description: Un 504 aquí no significa que el pago falló. Los intentos vienen de la tabla de
        evidencia del propio servicio, nunca del broker.
      operationId: PaymentsController_status
      parameters:
        - name: paymentId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta el estado de un pago y sus intentos
      tags:
        - payments
      x-bank-publishes: payment.status.query.v1
      x-bank-awaits:
        - payment.status.replied.v1
  /api/audit:
    get:
      description: "La única ruta que D-06 restringe por rol: solo ADMINISTRADOR. Es la vía por la que el
        frontend averigua cómo terminó cualquier comando asíncrono."
      operationId: AuditController_query
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta el rastro de auditoría de una correlación
      tags:
        - audit
      x-bank-publishes: audit.query.requested.v1
      x-bank-awaits:
        - audit.query.replied.v1
  /api/audit/recent:
    get:
      description: "Solo ADMINISTRADOR. Permite navegar los eventos del sistema con paginación y,
        opcionalmente, acotar por severidad (§4.1: INFO/WARNING/ERROR)."
      operationId: AuditController_recent
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Consulta los eventos de auditoría más recientes paginados
      tags:
        - audit
      x-bank-publishes: audit.events.list.query.v1
      x-bank-awaits:
        - audit.events.list.replied.v1
  /api/audit/notifications:
    get:
      description: "Solo ADMINISTRADOR, por D-06. Devuelve el registro operativo de lo que se envió, con
        destinatario simulado y estado real (PENDING/SENT/FAILED), acotado y con la cuenta de lo
        omitido. No es la bandeja del cliente: no existe (TD-041)."
      operationId: AuditController_notifications
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Lista las notificaciones que el sistema generó
      tags:
        - audit
      x-bank-publishes: notification.list.query.v1
      x-bank-awaits:
        - notification.list.replied.v1
  /api/notifications:
    get:
      description: "El alcance sale del token y la consulta no lleva customerId: no hay forma de apuntarla
        al buzón de otra persona. Es una pregunta distinta de /api/audit/notifications, que es la
        consola de staff y sí lleva el destinatario simulado de cada envío."
      operationId: NotificationsController_inbox
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Lista las notificaciones del propio cliente
      tags:
        - notifications
      x-bank-publishes: notification.inbox.query.v1
      x-bank-awaits:
        - notification.inbox.replied.v1
  /api/notifications/read:
    post:
      description: "Sin notificationIds marca todas. El alcance sale del token: un id de otra persona no
        coincide con ninguna fila y no cambia nada, en lugar de producir un rechazo que confirmaría
        que ese id existe."
      operationId: NotificationsController_markRead
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadDto"
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Marca notificaciones como leídas
      tags:
        - notifications
      x-bank-publishes: notification.mark-read.v1
      x-bank-awaits:
        - notification.read.replied.v1
  /api/dashboard:
    get:
      description: "Pregunta a los cinco servicios y devuelve lo que cada uno respondió. No calcula nada:
        cada número lo contó el servicio dueño de la tabla, que es el único que puede. Una sección
        que no llegó viene en null y deja el tile vacío en lugar de romper la pantalla."
      operationId: DashboardController_read
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - session: []
      summary: Compone los contadores de los tableros por rol
      tags:
        - dashboard
      x-bank-publishes: customer.stats.query.v1
      x-bank-awaits:
        - customer.stats.replied.v1
        - account.stats.replied.v1
        - transaction.stats.replied.v1
        - payment.stats.replied.v1
        - audit.stats.replied.v1
info:
  title: Bank USAC — API Gateway
  description: The only external entry point of the system (constitution V). It validates shape,
    authenticates, authorises by role and publishes onto the broker. It holds no business logic, no
    database and no HTTP client towards any internal service.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    session:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties: {}
    RequestPasswordResetDto:
      type: object
      properties: {}
    ConfirmPasswordResetDto:
      type: object
      properties: {}
    ChangePasswordDto:
      type: object
      properties: {}
    RegisterCustomerDto:
      type: object
      properties: {}
    UpdateCustomerDto:
      type: object
      properties: {}
    SetIdentityVerdictDto:
      type: object
      properties: {}
    SetKycStatusDto:
      type: object
      properties: {}
    DepositDto:
      type: object
      properties: {}
    OpenAccountDto:
      type: object
      properties: {}
    SetAccountStatusDto:
      type: object
      properties: {}
    TransferDto:
      type: object
      properties: {}
    UpdatePaymentSimulationDto:
      type: object
      properties: {}
    MarkNotificationsReadDto:
      type: object
      properties: {}
